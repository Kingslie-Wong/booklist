":false,"is_jialiao":true,"review":"开局就是男主的平静日常，有一个大胸姐姐和一个傲娇姐姐，还有一个国民第一偶像的女朋友，跟魅魔一样，每周准时来榨干男主，开始了激烈的修罗场，总体是恋爱和日常穿插，两个写得都很不错，能让人愿意读下去，但不是综漫同人，没有动漫角色，就是世界跟本子差不多。还有加料也没有加太多，中游水准，推荐配合加料看，更好冲。"},{"title":"重生后，她们都是食肉系","score":5.0,"score_system":"5","category":"擦边小说","meta":"中篇连载加料","is_classic":false,"is_jialiao":true,"review":"都市重生萝莉文，大部分都是萝莉，别说，我就喜欢萝莉，真不错啊，车速也飞快，而且前两百章还有好心人惊心加料，也符合原文，剧情偏日常，看萝莉就行了，喜欢萝莉的必看。"},{"title":"身处玉女仙宗，系统为什么称这里是动物园？","score":5.0,"score_system":"5","category":"擦边小说","meta":"加料长篇连载","is_classic":false,"is_jialiao":true,"review":"ntl，仙侠题材，文笔不错，车速飞快，飞起来那种，什么母猪师尊，雌小鬼磁悬浮应有尽有，加料之后更是刘备，不过就是剧情比较无聊，一直cb。"},{"title":"魅力点满，继承游戏资产","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇连载加料","is_classic":false,"is_jialiao":true,"review":"都市系统文，开局是男主玩过的游戏变为现实，自己在游戏中培养的明星总裁什么的，其实在现实真实存在，然后就是一无所有的男主在系统的指引下一步步与她们结识，（当然在这其中也用金钱和系统征服了一些女的）有趣的是女主们都认识男主，但是前面限于系统原因，无法相遇。此外本作加料是由知名加料人大鹅加料，符合原文，总体还是十分不错的。"},{"title":"妖精，休想乱我孝心","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完结加料","is_classic":false,"is_jialiao":true,"review":"修仙母子文，开局是白蛇青蛇中的白蛇收养了男主，培养了男主十几年，因为意外离开了男主，然后妖身意外被正道仙子的魂魄找到附身，但是男主并不知情，还是服侍母亲，随后开展的孝心故事，整体是就是好几个母亲宠爱男主，不错的剧情和文笔，加上也适配原文的加料（前期少一点），那种美母熟韵熟透了的描写，总体喜欢修仙母子的必读。"},{"title":"让你攻略女神，你怎么成魅魔了!","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完结加料","is_classic":false,"is_jialiao":true,"review":"都市穿越+海王+女神系统+颜值逆天+男魅魔+逆袭爽文+追夫火葬场，整体阅读感还是比较微妙的，前期男主作为豪门遗子，装作可怜的白莲花，让一众女主爱得死心踏地，男魅魔这一块。加料也符合原文，提升了车速，整体挺有趣的，有着女频的感觉。"},{"title":"我成了女魔头的心魔","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完结加料","is_classic":false,"is_jialiao":true,"review":"开局就是男主玩游戏，通过王朝最终大boss贵妃娘娘，也就是女魔头，没想到这居然是真的，还穿越到游戏里面，然后就是一顿操作，皇后与娘娘互相争抢，自己也开启了后宫，整体文笔和剧情都不错，女主也很多，加料也比较适合原文，可以一看。"},{"title":"谁在造谣我对她们的孝心变质了","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完结加料版","is_classic":false,"is_jialiao":true,"review":"经典师徒孝心文，不过其质量和加料都比不过上面那本，但是本身素质还是不错的，喜欢的可以看看。"},{"title":"电车剧情后，你告诉我你没上车？","score":5.0,"score_system":"5","category":"擦边小说","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"学校开场，有调教，爽开校园后宫，ntl人妻，车速起飞了，除了和谐词，跟刘备没什么差别，细节描写到位。"},{"title":"我只想认真给她们摄影","score":5.0,"score_system":"5","category":"擦边小说","meta":"中篇完结番外","is_classic":false,"is_jialiao":false,"review":"诶，同样作为一个摄影师，我只能说根本没有这种摄影生活，我不相信。男主真是太幸福了，不仅能跟萝莉少女拍照片甚至私房，还能草逼，要是我能这样，让我开豪车住别墅，我都愿意啊。此外，整体车速偶尔临近飞起，不过有作者写的番外插入，还是值得观看。"},{"title":"魅魔小正太的后宫之旅_完美加料版本","score":5.0,"score_system":"5","category":"擦边小说","meta":"中篇完结加料","is_classic":false,"is_jialiao":true,"review":"既有小马拉大车，也有萝莉，飞起来，而且确实是完美加料，跟刘备没有差别了，一直在草逼。"},{"title":"继承人小姐对我不太友善","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完本","is_classic":false,"is_jialiao":false,"review":"起点的日轻，之所以把他放这里，主要是他的角色番外写得真棒，每一个女主都有个一两百页的肉文番外，包括主奴调教，猫猫装扮什么的，不得不说还是作者自己写的色，正文比较清淡，你快速浏览就行，主要看穿插其中的番外。"},{"title":"我穿越进了病娇美少女恋爱游戏","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇完结加料","is_classic":false,"is_jialiao":true,"review":"多女主的色色的恋爱故事，加上修罗场什么的，加料也不错，符合原文。"},{"title":"从继承商店街开始东京生活","score":5.0,"score_system":"5","category":"擦边小说","meta":"中篇完本 加料版","is_classic":false,"is_jialiao":true,"review":"很快的车速，ntl，人妻太太等色色，加上不是很臃肿的加料，还是很不错的"},{"title":"仙子，你们人设崩了","score":5.0,"score_system":"5","category":"擦边小说","meta":"长篇连载加料","is_classic":false,"is_jialiao":true,"review":"武侠奇幻文，男主穿越体，开局有个熟妇小姨，然后又遇到了合欢妖女想征服她，之后又是佛门圣女是他的姐姐等等，身边都是仙子，修罗场这一块，肉戏的话，也是类似于个人加料的，总体体验不错。\n\n让你驱灵，你管僵尸叫老婆（中篇连载加料）男主开局意外唤醒了沉睡千岁的僵尸，在系统的帮助之下才逃过一劫，不过也开始了与僵尸的同居日子，加料加得还可以，有加料阅读更有劲了整体还算不错。"},{"title":"师姐，我不想努力了","score":4.0,"score_system":"5","category":"擦边小说","meta":"中篇完本 加料版","is_classic":false,"is_jialiao":true,"review":"经典师徒题材，不过整体情节一般，文笔还行，加料中规中矩，适合喜欢仙子师尊的看"},{"title":"我在魔幻印度当慈父","score":4.0,"score_system":"5","category":"擦边小说","meta":"中篇连载加料","is_classic":false,"is_jialiao":true,"review":"不得不说，写印度的确实少，这个是特殊世界观下的古印度，每个地区都有各自的特殊力量，一些设定还是比较淫秽的，剧情不错，加料也比较符合原文，可以一尝。"},{"title":"韩城：我与未来有扇门","score":4.0,"score_system":"5","category":"擦边小说","meta":"长篇连载加料","is_classic":false,"is_jialiao":true,"review":"韩娱文，主要是韩国女团什么的，我不混韩圈看不懂，不过文笔还可以，加料也符合原文，从 ystem":"5","category":"综漫同人","meta":"中篇连载加料","is_classic":false,"is_jialiao":true,"review":"开局男主被车撞觉醒了邪恶哥布林系统，然后就是完成系统发布的任务，强奸女警等等，整体偏向调教类，ntl浓，纯后宫不纯爱，加料比较一般但能看。"},{"title":"人在东京肆虐，太太们请留步！","score":3.0,"score_system":"5","category":"综漫同人","meta":"长篇完结加料","is_classic":false,"is_jialiao":true,"review":"在东京降妖除魔类，不怎么感兴趣，加料加得也一般。\n\n五．最后感言\n\n说实话，这么久没更了，不是不想更，是实在没有发现什么纯爱或者后宫无绿的作品啊，有点心累了，只能说刘备写的好的很少，而无绿或者纯爱的刘备就更难得了。最近看了不少新书，只能说大部分都是p站式的短篇，就几万字，怎么说呢，我推荐里面的短篇大部分也就几万十几万字，短篇很多，主要是好写，人物往那一摆，肉戏稍微水水，一篇文章就这么写好了。也没什么剧情，感情，以及男女主互动，感觉就单纯在看活塞运动，所以说我现在看短篇都有点疲劳了，肉戏的部分很少能完成看下去，这个时候我又想起了鸡叉和关关等人写的纯爱后宫，以及一大批纯爱后宫加料，不得不说，我认为最理想的就是一部好的作品加上神级加料，不过这种十分少，也就红楼之挽天倾，为什么她们总想让我孝心变质，恋爱模拟器等等小说比较符合这个标准，这种好的只能说看一部少一部啊。前几天看了网友给网文由夯到拉排等级，底下有人说要不要分析刘备，不过有人说刘备没什么好分析，好的刘备放网文圈里只能说质量中等的，我想了一下还确实差不多，毕竟刘备写出来本来就是为了冲的，为了肉戏，牺牲情节是很常见的。不过我认为好的作品还是不少的，有的即使以网文的角度看也能是神作，在这里还是十分感谢写纯爱或7者无绿刘备的，毕竟他们大多基本都是为爱发电。8.4日纯爱战神记。\n\n2025.2.6日1.0版本\n\n2025.5.17日2.0版本\n\n2025.8.4日3.0版本\n\n-----------------------------------本文件来自尚香书苑。发布页：sxsy.org-----------------------------------"}],IC={heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.9-8.4a5.5 5.5 0 0 0-.1-7.8Z"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4.2 4.2L19 6.8"/></svg>',shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'},STATUS=['未完结','停更','烂尾','太监','完本','连载','完结'],LENGTH=['超长篇','长篇','中篇','短篇'];
function derive(b){const s=`${b.title} ${b.meta||''} ${b.review||''}`,tags=[];let status='',length='';for(const x of STATUS)if(s.includes(x)){status=x;break}for(const x of LENGTH)if(s.includes(x)){length=x;break}if(b.is_classic)tags.push('经典');if(b.is_jialiao)tags.push('加料');for(const t of ['ntl','调教','催眠','萝莉','巨乳','人妻','母子','乱伦','触手','综漫','同人','仙侠','都市','西幻','武侠','历史','末世','游戏','纯爱','后宫','父女','姐妹','兄妹','逆推'])if(s.toLowerCase().includes(t))tags.push(t);return{...b,status,length,tags:[...new Set(tags)]}}const DATA=BOOKS.map(derive),CATS=['全部',...new Set(DATA.map(x=>x.category))],GL={god:'神作',rec:'推荐',good:'可读',mid:'一般'};function grade(b){return b.score_system==='10'?(b.score>=9?'god':b.score>=8.5?'rec':b.score>=8?'good':'mid'):(b.score>=6?'god':b.score>=5?'rec':b.score>=4?'good':'mid')}const state={q:'',category:'全部',status:'全部',length:'全部',grade:'全部',sort:'score-desc',view:'all',tag:null},FAV='booklist_fav',READ='booklist_read',THEME='booklist_theme',$=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),load=k=>new Set(JSON.parse(localStorage.getItem(k)||'[]')),save=(k,v)=>localStorage.setItem(k,JSON.stringify([...v]));let fav=load(FAV),read=load(READ);
function theme(t,store=false){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;if(store)localStorage.setItem(THEME,t);const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);$('#themeIcon').innerHTML=dark?'<path d="M12 3v2m0 14v2M5.6 5.6 7 7m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4"/><circle cx="12" cy="12" r="4"/>':'<path d="M20.6 15.7A8.2 8.2 0 0 1 8.3 3.4 8.2 8.2 0 1 0 20.6 15.7Z"/>';$('#themeColor').content=dark?'#0D1425':'#fff'}theme(localStorage.getItem(THEME)||'auto');$('#themeBtn').onclick=()=>{const now=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');theme(now==='dark'?'light':'dark',true)};
function filtered(){let v=DATA.slice();if(state.category!=='全部')v=v.filter(x=>x.category===state.category);if(state.status!=='全部')v=v.filter(x=>x.status===state.status);if(state.length!=='全部')v=v.filter(x=>x.length===state.length);if(state.grade!=='全部')v=v.filter(x=>grade(x)===state.grade);if(state.tag)v=v.filter(x=>x.tags.includes(state.tag));if(state.q){const q=state.q.toLowerCase();v=v.filter(x=>`${x.title} ${x.meta||''} ${x.review} ${x.tags.join(' ')}`.toLowerCase().includes(q))}if(state.view==='fav')v=v.filter(x=>fav.has(x.title));if(state.view==='read')v=v.filter(x=>read.has(x.title));if(state.view==='unread')v=v.filter(x=>!read.has(x.title));return v.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title,'zh'):(a.score-b.score)*(state.sort==='score-asc'?1:-1))}
function stats(){const avg=sys=>{const x=DATA.filter(b=>b.score_system===sys);return(x.reduce((n,b)=>n+b.score,0)/x.length).toFixed(1)};$('#statsBar').innerHTML=[[DATA.length,'收录书目'],[avg('10'),'/10 分区均分'],[avg('5'),'/5 分区均分'],[fav.size,'本地收藏'],[read.size,'已读标记']].map(([n,l])=>`<div class="metric"><div class="n">${n}</div><div class="l">${l}</div><i class="rule"></i></div>`).join('')}
function cats(){$('#cats').innerHTML=CATS.map(c=>`<button class="cat ${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)} <span class="cnt">${c==='全部'?DATA.length:DATA.filter(x=>x.category===c).length}</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;cats();render()})}function panel(){const cs=CATS.slice(1),max=Math.max(...cs.map(c=>DATA.filter(b=>b.category===c).length)),box=(t,b,n=false)=>`<section class="panel"><h3 class="panel-title" style="background:${n?'var(--navyhead)':'var(--blue)'}">${t}</h3><div class="panel-body">${b}</div></section>`,d=cs.map(c=>{const n=DATA.filter(x=>x.category===c).length;return`<div class="dist-row"><span>${esc(c)}</span><b>${n}</b></div><div class="bar"><i style="width:${n/max*100}%"></i></div>`}).join(''),g=['god','rec','good','mid'].map(k=>{const n=DATA.filter(x=>grade(x)===k).length,c={god:'blue',rec:'navy',good:'light',mid:'gray'}[k];return`<div class="dist-row"><span>${GL[k]}</span><b>${n}</b></div><div class="bar"><i style="width:${n/DATA.length*100}%;background:var(--${c})"></i></div>`}).join(''),ts={};DATA.forEach(b=>b.tags.forEach(t=>ts[t]=(ts[t]||0)+1));const tags=Object.entries(ts).sort((a,b)=>b[1]-a[1]).slice(0,28).map(([t,n])=>`<button class="tag ${state.tag===t?'on':''}" data-tag="${esc(t)}">${esc(t)}<small>${n}</small></button>`).join('');$('#panel').innerHTML=box('原始收录分区',d)+box('推荐度分布',g,true)+box('内容标签索引',`<div class="genre-grid">${tags}</div>`);document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{state.tag=state.tag===b.dataset.tag?null:b.dataset.tag;panel();render()})}
function filters(){const select=(id,items,v)=>`<div class="select-wrap"><select id="${id}">${items.map(([x,n])=>`<option value="${x}" ${x===v?'selected':''}>${n}</option>`).join('')}</select></div>`;$('#filters').innerHTML=select('grade',[['全部','推荐度：全部'],...Object.entries(GL)],state.grade)+select('status',[['全部','状态：全部'],...STATUS.map(x=>[x,x])],state.status)+select('length',[['全部','篇幅：全部'],...LENGTH.map(x=>[x,x])],state.length)+select('sort',[['score-desc','评分：高至低'],['score-asc','评分：低至高'],['title','书名排序']],state.sort)+`<div class="view-buttons"><button class="control ${state.view==='all'?'on':''}" data-view="all">全部</button><button class="control ${state.view==='fav'?'on':''}" data-view="fav">收藏</button><button class="control ${state.view==='read'?'on':''}" data-view="read">已读</button></div>`;for(const [id,k]of [['grade','grade'],['status','status'],['length','length'],['sort','sort']])$('#'+id).onchange=e=>{state[k]=e.target.value;render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;filters();render()})}function tools(){$('#toolActions').innerHTML=`<button class="control" id="unreadBtn">未读</button><button class="control" id="randomBtn">${IC.shuffle} 随机推荐</button>`;$('#unreadBtn').onclick=()=>{state.view=state.view==='unread'?'all':'unread';filters();render()};$('#randomBtn').onclick=randomPick}
function render(){const v=filtered();$('#listCount').innerHTML=`当前显示 <b>${v.length}</b> 本${state.tag?` · 标签「${esc(state.tag)}」`:''}${state.q?` · 检索「${esc(state.q)}」`:''}`;$('#cards').innerHTML=v.length?v.map(b=>{const g=grade(b),a=fav.has(b.title),r=read.has(b.title),chips=[`<span class="chip primary">${esc(b.category)}</span>`,b.length&&`<span class="chip">${b.length}</span>`,b.status&&`<span class="chip">${b.status}</span>`,b.is_jialiao&&'<span class="chip">加料</span>',b.is_classic&&'<span class="chip">经典</span>'].filter(Boolean).join(''),p=(b.review||'').split('\n\n').filter(Boolean);return`<article class="book ${a?'fav':''} ${r?'read':''}" data-title="${esc(b.title)}"><div class="book-top"><div class="score ${g}"><b class="v">${b.score}</b><span class="sys">${b.score_system==='10'?'/ 10':'/ 5'}</span></div><div><h3 class="book-title ${b.is_classic?'classic':''}">${esc(b.title)}</h3></div><div class="book-actions"><button class="tiny ${a?'active':''}" data-fav aria-label="收藏《${esc(b.title)}》">${IC.heart}</button><button class="tiny ${r?'active':''}" data-read aria-label="标记《${esc(b.title)}》已读">${IC.check}</button></div></div><div class="chips">${chips}</div>${p.length?`<div class="book-review clamp" data-review>${p.map(x=>`<p>${esc(x)}</p>`).join('')}</div><button class="expand" data-expand>展开书评 ↓</button>`:''}</article>`}).join(''):`<div class="empty"><b>暂无匹配书目</b>请调整分区、标签或检索关键词后再试。</div>`;document.querySelectorAll('.book').forEach(el=>{const t=el.dataset.title;el.querySelector('[data-fav]').onclick=()=>{fav.has(t)?fav.delete(t):fav.add(t);save(FAV,fav);stats();render()};el.querySelector('[data-read]').onclick=()=>{read.has(t)?read.delete(t):read.add(t);save(READ,read);stats();render()};const b=el.querySelector('[data-review]'),e=el.querySelector('[data-expand]');if(e)e.onclick=()=>{b.classList.toggle('clamp');e.textContent=b.classList.contains('clamp')?'展开书评 ↓':'收起书评 ↑'}})}
function randomPick(){const v=filtered();if(!v.length)return;const b=v[Math.floor(Math.random()*v.length)],p=(b.review||'').split('\n\n').filter(Boolean);$('#modalBody').innerHTML=`<div class="m-kicker">${esc(b.category)} · ${GL[grade(b)]}</div><div class="m-title">${esc(b.title)}</div><div class="m-score">${b.score} ${b.score_system==='10'?'/ 10':'/ 5'}${b.length?' · '+b.length:''}${b.status?' · '+b.status:''}</div><div class="m-review">${p.slice(0,3).map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="m-actions"><button class="m-btn" id="mAgain">再抽一本</button><button class="m-btn primary" id="mFav">${fav.has(b.title)?'已收藏':'收藏此书'}</button></div>`;$('#modalMask').classList.add('show');$('#mAgain').onclick=randomPick;$('#mFav').onclick=()=>{fav.add(b.title);save(FAV,fav);stats();$('#mFav').textContent='已收藏'}}$('#modalClose').onclick=()=>$('#modalMask').classList.remove('show');$('#modalMask').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('show')};let timer;$('#search').oninput=e=>{const q=e.target.value;$('#clearBtn').style.display=q?'block':'none';clearTimeout(timer);timer=setTimeout(()=>{state.q=q.trim();render()},150)};$('#clearBtn').onclick=()=>{$('#search').value='';$('#clearBtn').style.display='none';state.q='';render()};stats();cats();panel();filters();tools();render();
</script></body></html>
