<script>
const BOOKS=[{"title":"红楼之挽天倾加料版","score":9.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"这本加料我认为是加料界的最强者，加料了足足几百万字，这都比一大批刘备还强，而且加料的内容也并不突兀，结合刘备的描写秒杀市面9成的刘备，绝对的量大管饱。因此你说他是刘备也别无不可。在剧情方面，背景作者虚构的是类似中后期的大明，剧情主要是讲了穿越而来的男主从贾府无人关注且受欺负的闲人，相识贵人，从而一步步展现自己的军事和政治才能，帮助危难的国家一步步稳定政局，击败外敌，是历史争霸的套路，最后也是当上了皇帝。整篇贯彻爽文的主旨，但又不会让人觉得尴尬，更多的是身临其境的爽感。就算你没读过红楼也不影响，因为是架空世界观。剧情方面的节奏把控的很好，就算没有加料，也能一直读下去。在人物方面，本作足足收了几十名女主，红楼的自创的都有，姐妹，母女，ntl等等什么类型都有，而且难能可贵的是，基本每个收的女角色都有与男主的感情描写，重点角色如林黛玉和宝钗等等描写的更多，而且每一位都基本有几万字的刘备，同时刘备的描写也很细致，符合语境，也没有破坏人设。总结是超大杯顶级刘备，喜欢的刘备或者红楼的必看。"},{"title":"为什么她们总想让我孝心变质加料","score":9.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇仙侠纯爱后宫，母子，师徒，师兄妹，仙子等等，仙侠要素拉满。本作的加料，我认为足以匹敌上一本，数量多，质量高，加料后的版本，已经可以算是真正的超大杯仙侠刘备了，读起来太爽了，不仅剧情节奏很好，而且人物方面，又媚又纯的师尊不断主动挑逗我，让我不得不，不断当逆徒冲师，跟师尊学习小学。后面还有姨娘，双胞胎师妹，温柔的姐姐，溺爱的义母等等，女主类型很多，难能可贵的是男主跟她们之间也是都有感情戏的，并不是无脑推，特别是中后期跟女剑仙和狐尊的感情戏，很有鸡叉和关关的味道，情与爱相结合，这才是真正的情色小说。在看完很多作品的加料后，这本书的加料量大管饱同时又符合文本，这是难得可贵的，现在很多加料都很突兀，这是很少的加料精品，仅次于量大的红楼加料。总结就是喜欢仙侠的必看，超大杯作品。"},{"title":"神话生物攻略手册","score":9.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇纯爱后宫，独立世界观，东西方神话生物都有，剧情精彩，花样也多。去年我看到过的最好的几本小说之一了，目前更新了三卷，第一卷主要是傲娇天使，魅惑魔王，可爱吸血鬼真祖。每一卷剧情和人物都很棒，不止于刘备，就算把他放在起点等也能火，伟大无需多言。唯一缺点是还是短了，期望作者越更越好。此外作者也是真正的强者，每次虽然等的久 但是一发都是一整卷，给我看爽了。这种为爱发电的伟大行为必须好评在内容方面，首先男主楚明是穿越的，没有系统，无战力，因此成为了贫民，因此前期就跟一个混子一样，普通刘备文男主水平，但是到后面面对困难表现有担当，显现出一个普通穿越者的复杂形象，即在摆烂的表象下也有敢拼命的勇气。也正是这种比较正面有魅力的形象才能在后期让第一个天使女主倾心。不过男主没有能力其实也是能力，也就是他万法不侵，这在攻略女主中发挥重要作用。女主方面，第一卷的女主是个傲娇天使，原本女主作为神话生物，没有人类情感，不过在男主的情感攻略下，逐渐有了人类情感，更加真实，也渐渐爱上了男主。第二卷写了女魔王和女真祖，这个女真祖很有意思，她是个资深的二次元迷，只能说人设是真的不错。到了第三卷，又出现我们中土的女皇帝，怎么说呢，世界观融合了神话史诗，很宏大，很有想象力，放在起点也不过时。总结推荐每一个人观看，不管你喜不喜欢看刘备。"},{"title":"《呢喃诗章》加料版","score":9.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"超长篇西方奇幻纯爱后宫神作，英伦蒸汽朋克+诡秘超凡设定，世界观扎实、剧情稳扎稳打。主角与猫同行，于呢喃中揭开纪元秘辛，节奏舒缓治愈，对得上电波就会越读越上头。剧情方面，以题目呢喃诗章中记载的十二位被选者为主，一个个被选者单元为一长卷，整体节奏舒缓，每一卷基本是前面较长的铺垫和中后期的高潮相结合，读完一卷，有一种参与过史诗的感觉，不过还是比较看受众，你得有耐心看得下去前期比较长的铺垫，得沉浸入这个世界。正因如此，本书即使更了四千多章，二千多万字，还是在更，绝对量大管饱。人物方面，本作男主是个五好青年，唯一的缺点可能就是滥情了（你不滥情我们看什么），至于女主，有很多，什么公主，魔女（这个世界里的魔女排斥除了男主之外的一切男性，所以年轻大魔女基本都是男主后宫），一大把，不过虽然女主多，但是都不是一笔带过的花瓶，都有相应与男主互动的剧情副本，都很纯爱，而非推土机。刘备方面 ，只能说不能以看刘备为目的看这本，因为直到500多章男主才交出第一次，不过后面破处之后车速快了许多，玩的时候玩法也不少。加料版也只是对原著应该做的地方进行加料，没有突兀的加料，因此可以直接读加料版。最后总结，喜欢蒸汽朋克与超凡世界的必看，喜欢纯爱后宫的也可以看看。"},{"title":"满船淫梦压星河","score":9.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"神作，当之无愧的纯爱刘备神作，诶，好久没看见这么纯爱，写得这么好的刘备了，我做纯爱后宫刘备鉴赏，就是要读这种质量的作品啊，可惜现在的刘备界，是后宫很少，是一对一的纯爱更是少之又少 ，写得好的更是凤毛麟角。作品质量方面，写得很好，很有青春和恋爱感，男女主是青梅竹马，作品目前更的比较短，主要讲的是女主来到男主留学的俄罗斯旅游，然后两人也是终于表明心意，在一起了。这个过程写得真的很有细节，女主在外人面前比较冷，在男主面前娇憨，撒娇的姿态，我真是太喜欢了  女主太喜欢了，男主形象也很好，男女主之间的互动，也很温馨，让我感觉想恋爱了。最难能可贵的是他的刘备写得也不错，那种两人都是初次，初夜互相探索的懵懂青春，色色的感觉，写得真不错，后面还有边做边接女主母亲电话的刺激情节，只能说刘备这一块也拿捏了。最后总结必看，唯一缺点是更的还是太少了，我都想拿着鞭子抽作者，让他快更了。"},{"title":"性爱完全自由的武侠世界，与身为记录者的淫乱家族们","score":9.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇纯爱后宫，p站玛托雅妈妈大神写的神作。我必须向所有喜欢纯爱后宫刘备的人推荐她。作者上一部作品是《秋之家》，懂的都懂，特别喜欢母亲，姐妹，女儿大家族式的做爱。真的太色了，首先是这个很独特很有新意的性爱完全自由世界观，作者不是简单地当做背景，而是详细地描写了里面的风土人情，这个确实让人惊奇。脑洞确实可以，也很有特点。其次就是在这个世界观下，男主很合理地收了母亲和姐姐，并让母亲又给她生了几个女儿，并又让女儿们怀了孕，很涩，特别色，女主还有女儿们都十分爱男主，男女主们之间互相相爱，互相尊重的感觉太好了，在后面男主又遇到三对与他有血缘缘分的母女，又收了三对母女并重复此步骤，也在此之间逐渐解开世界为什么会变成这样的秘密。总结是喜欢纯爱后宫必读之作，当然缺点是肉占比确实多，看到后期有点腻，所以推荐一点一点看。"},{"title":"剑仙小师弟就是我加料","score":9.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇仙侠纯爱后宫，原文是很好的纯爱后宫小说，每个女角色都有自己的感情线，人物形象很丰满，感情戏方面给我的感觉跟以前读姬叉的小说一样体验拉满。本文的剧情也是围绕攻略女主展开，没有多少玄幻争霸剧情。本文男主也是长期躺平间接奋斗的类型。当然也有缺点，不过不是毒点，是原文前期有些文青，存在拉扯，剧情开展地有点慢了。不过到中后期男主推女速度就快了起来，前期没收的基本全收了，最后是圆满结局。我第一次读就是没熬过前面，但是后面找到加料版，它用刘备稍微弥补了前期的无聊拉扯，用心的是加料是全文全面的加料，而且并不是很突兀，加料的质量很高，这点很难得。"},{"title":"御仙","score":9.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠纯爱后宫。这是近期连载的一款爆品了，说实话我之前看的好多有情有刘备的经典都是一几年的了，如今新生代写的好的情与刘备感觉很少。而这本书在御仙的核心以情与欲御仙，主情辅欲，既有刺激的刘备，也有温情的感情戏。男主也善良正义，有担当有智慧，这样的人有御仙的气运我也是认可的。此外，在刘备方面，本作是特色的互相尊重式的恩爱型主奴调教，男主没有真正的把师父当作性奴，而是抱有爱意和敬意，女主被男主这种爱意包裹，更加爱着男主。纯爱式的调教，好评！希望作者再接再厉，争取写成新生代的经典长篇。总结喜欢仙侠的必看。"},{"title":"公爵少爷的爱欲乐园计划","score":9.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，都市日漫纯爱后宫，真正的长篇纯爱后宫巨作，少见的日漫大乱炖，融合了许许多多的日漫角色，比如有辉夜大小姐想让我告白:早坂爱，路人女主的养成方法，春物，樱花庄，缘之空等等。首先是本作超强的刘备方面，本作的男主是有系统的，所以玩的花样，多得你难以想象。在瑟瑟方面，多p和道具是常态。只有你想不到的，没有他写不到的。在肉的描写方面写的很好，有母女推，有主奴推，有萝莉也有熟妇，基本全包了。还有是男主的xp有舔阴，作者关于阴部的描写是我都刘备以来最细致的，也是最有感觉的，写得我都想舔了。此外在系统的帮助下，男主还有各种鬼畜技能比如无限精液，改变女生体质等等。在瑟瑟方面，他是无敌的。这本书在情节方面整体可以，推女也不全是推土机，重点角色如雪乃还是有感情戏的，日漫角色整体也符合原作，没有多少破坏人设的地方，不过有些地方有些摩蹭，但是长篇可以理解。总结即使你没看过这些动漫，就花样和肉戏就值得观看学习。"},{"title":"《龙魂侠影》修改版","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"这也是一篇百万字的长篇纯爱后宫经典，剧情与人物齐飞，刘备与情感共长天一色，本作在剧情上跌宕起伏，即使抛开刘备，也是一部合格的长篇玄幻文。本作在人物上也有所主次，基本都有感情线，有的感情线也十分之好，有鸡叉关关的水平，在刘备方面，各种花样也齐全，两对母女，仙子，妖女，魔女，圣女应有尽有，各种道具调教也应有尽有。真的我是第一次见玩这么花的纯爱后宫小说，不仅有感情，而且玩的还花，情色交融，这谁受得了，有些刘备简直比非纯爱还刺激。当然我还是推荐你看修改版的，因为是经典所以总是存在着一些小雷，这些虽然不影响，但还是完美无雷的最好。"},{"title":"《我在北电当教兽》","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"在看这本书之前，我一直是对那种写小说征服明星的不感兴趣，直到我读了这本很久以前的经典，我才明白了其乐趣。即使你对明星并不了解也没关系，本书将里面的角色描写的很好，即使你当成一个独立的角色也没问题。当然你也能体验到征服刘亦菲等最知名的明星，体验双飞等多种花样。同时本作的男主也不是出生，形象也很正面，文娱创业也很爽，去掉刘备也是一本佳作。唯一值得遗憾的是这本书没有永远无法完结了。不过评分之所以9分，可能是我个人的滤镜，毕竟这也是好久之前的书了。"},{"title":"美女师傅的香艳双修","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇完结，仙侠纯爱刘备。在仙侠题材里面纯爱的实在太少。这本在保留了仙子文很好的仙子描写的同时，还是个纯爱的1对1师徒文，且大部分内容都是肉，肉戏写得很有味道，有了点当初看修行的味道，只能说p站作者还是会写肉。虽然十几万字但是依旧量大管饱。喜欢仙子文的一定要看，绝对推荐。她还有第二本，不过那个是收费的，内容是男女主尽历各种心境试炼，比如老师与学生，女侠和贼等等。质量感觉不如第一本，不过也可以，可以等流出。"},{"title":"我在大学学驱魔","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇纯爱后宫，独立世界观，哥特萝莉，女仆，圣女，道具调教。很好的作品，剧情，人物，感情，刘备也都有，不过各个方面都感觉比神话生物攻略手册差一些，主要是前期男主与第一个女主情节有点快了，之后都很好，很有花样，其中有一个女主令我印象深刻，就是她是个热爱二次元的班花，就跟动漫里的女孩那样可爱，可恶，我怎么没遇到一个，艹。  连载中"},{"title":"与雪之下雪乃的青春淫欲试炼","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结，一对一纯爱神作，我最近也回顾了一下，感觉是穿越到春物系列的神作，其中关于雪乃的描写特别好冲，真的强烈推荐，就算你没看过春物，也可以只看他的刘备，那种高冷女神对他人冷漠但唯独对你热情，妩媚的感觉实在是太棒了。不过本文男主并不是大老师，其实跟原著情节也没多大关系，是作者创作的男主也就是读者，时常在秘境里与雪之下完成各种羞羞的任务，没完成就不许出去。当然真正原因没有那么简单，不过结局是圆满的。总结喜欢清冷美人只对你热情的必看。"},{"title":"《我可是要做仙尊和魔帝的男人》加料","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"长篇完结纯爱后宫，姐妹井，师徒井，调教仙子等等。飞鸟继《魔魂启临》后的又一力作，熟悉的自创历史（就是参杂神话和历史的大争之世），熟悉的面具流，熟悉的调教，熟悉的姐妹井。这本书我加料和没加料都读了一遍，本身的剧情因为大争之世所以十分紧凑，跌宕起伏。人物也十分多样，玩的花样也很多，再加上加料十分之多，读起来十分舒适 。总结十分推荐每一个喜欢仙侠和作者的人看，前期可能有点无聊，但越到后越精彩，本身的部分也可以说是神作了。"},{"title":"魔门妖女凭啥跟我谈恋爱加料","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇仙侠纯爱后宫，本文本身素质就不错，加料更是为数不多的好加料，是全文范围的大规模有理由的加料，加料得毫无违和感，跟红楼加料一个档次，可以看做刘备文了。本作的男主是那种天下第一但躺平型的男主，开局即失忆，被合欢宗女宗主捡回了魔门，开局就已经和魔门大师姐做了，不过男主是被动享受，车速极快。不过有必要说的是男主前期过于摆烂，就是那种什么也不想干躺平的态度，对于剧情节奏来说是真慢，而且文风偏文青，不过到中后期好多了。总之喜欢仙侠和被动享受的推荐观看。"},{"title":"恋爱模拟器3.1（加料版）","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结，都市纯爱后宫，特点是男主能跟各个女主进行恋爱模拟，就跟游戏一样，能够模拟一生，模拟完后女生也是有一些记忆的。本文塑造得各种女主都不错，每一个都基本能单领出来写一篇长的，跟每一个女主都有一段纯爱的经历，不过在现实中则是后宫。再加上质量很高的加料刘备，又好看又好冲，顺便说一下这个加料是north加料，他的加料一向很好，之前是红楼挽天倾。不过前期加料多，后期加料就少了一点，不过也不碍事，总结来说十分推荐纯爱和后宫党阅读。"},{"title":"情花孽","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，仙侠纯爱后宫，这也是新生代的一本不错的连载小说，他跟《御仙》一样开篇惊艳，他的第一卷质量很高，可以给9.1分，主要在于情于刘备皆有，而且文笔很好，时不时就能用一段诗词应景，很有意境。剧情节奏很舒缓，不过到第二卷阅读体验有些下降，这卷大多是在铺垫世界观与剧情，情与刘备只有一点，每章感觉有点短，但所幸一直在更，目前还是可以的，没有什么雷，希望作者能把握好节奏，再创佳卷。"},{"title":"纯爱系情侣的sex日常","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇完结，1v1的最纯的纯爱，也是最色的纯爱。主要内容就是纯爱情侣相识相爱相伴的过程和日常生活，毋庸置疑的纯爱神作，不接受反驳。里面女主还给男主出过斯卡蒂的cos，NND，舟友吃这么好，要是哪天我也能有像小说里的女主那样的女朋友就好了。"},{"title":"青梅竹马的纯爱反差小日常","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，纯爱短篇神作，跟上一本差不多，一个p站的中短篇，男女主人物的对话和心理描写的很真实生动，刘备方面也很满意，看着不会太腻。纯爱党必看的神作，我要是也有青梅就好了，这种生活真就只有梦中有，年度科幻巨作，当然作者要是能再写点就更好了。"},{"title":"雪之下的秘密侍奉活动","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇都市纯爱后宫刘备，这本春物雪乃的同人可以跟《与雪之下雪乃的青春淫欲试炼》相比较了，（当然还不如那本）写的是真的好，本文的雪之下是先上车后补票，就是男主先是动用了常识修改催眠之类的手段让雪之下给下进行色情的侍奉活动（不过这个就对学乃使用过），到后来男主不止于身体，逐渐与雪乃培养感情，描写的互动也比较甜。不同于另一本近乎原创，本文重点情节跟原著相似，十分推荐喜欢春物和雪乃的人看，没看过的也可以看作女神文看，角色和刘备都不错。"},{"title":"穿越修仙界，外挂是《母猪的产后护理》","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"短篇连载，仙侠搞笑纯爱后宫刘备，十分推荐观看，说实话这种搞笑刘备是真的好看。首先本书内容就是标题，不过母猪是仙子。产后护理的知识与攻略女主相结合。因此主线就是在与仙子认识过程中，如何靠这本书攻略女主，这个过程并不无脑，很有创意，也有点感情戏，此外本书除了玩梗母猪手册外，还有作者是个粥批，特别迷恋脚，把我这个粥友看笑了。其他玩的梗也数不胜数，只能说作者太有活了，读起来很搞笑 。至于刘备方面描写的也很好，母猪感很到位，只能说这个水平在起点写也能火。最后推荐所有人必看，能让你开开眼界。"},{"title":"山形依旧枕寒流","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结加中长篇番外，都市纯爱后宫，人妻，继母子，老师，姐妹，小马拉大车等等都市有的都有。这本评价就是很很稳扎稳打的一部作品。百万字长篇，剧情节奏比较舒缓。女主们方面也有心理描写和角色刻画，与男主也有感情戏。这点好评，并不无脑。而男主方面只能说中规中矩吧。此外就是他营造的都市氛围也很有感觉，也比较现实，这个看个人。最后他是有番外的，番外就是主线之后的故事，也收了妹妹，写得也不错。整体而言是一部质量很不错的都市纯爱后宫小说。推荐喜欢都市纯爱后宫的，都可以看看。起码可以看一眼，看他的文笔对不对你胃口，毕竟这也是少有的都市纯爱后宫长篇了。"},{"title":"东京，我解锁了她们的特殊成就","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"连载纯爱都市后宫文，在尺度上，虽然不是刘备，但其车速极快，描写极为详细，已经与刘备无异。本书的特色是纯爱式的主奴调教，男主有系统，先是让高冷的女老师精液中毒，然后就是发现网上约的福利姬是校花，然后征服高冷校花，刺激点是两个女主被男主征服后都特别主动，那种反差感好评，后面也有校花母女井，可惜在于不是真正的刘备，写的也不是太多。"},{"title":"淫仙路","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，纯爱后宫仙侠刘备文，难得啊，仙侠刘备文又来了个潜力股，这本新书很好，很有潜力。最有特色的是他的文风和细节，本书的文风很有仙侠的味道，细节把控的也不错，就算去除了刘备放起点也是不错的仙侠文。剧情节奏不快，比较舒缓。书名虽然名为淫仙路，但是前期根本没有淫仙，淫仙路指的是男主偶然获得的功法，男主可以锻炼升级自己的阳根，然后与女主们双修升级。男主本身十分善良正义，好评。男主与前期两个女主也是有感情的，也就是纯爱，不是调教征服。总结喜欢纯爱仙侠后宫的必看。"},{"title":"《极品家丁》加料版","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"顶尖的纯爱后宫神作。家丁这本书也是是16年前，07年开始连载的作品了，不知不觉时光已经过去这么快了吗，以如今的眼光看，这本书的许多创意已经烂大街了，但是你不要忘了这是一本07年的书，那个时候《斗破苍穹》都还没有连载呢。因此以他至今仍是出彩的人物塑造和剧情安排，他无愧是后宫文界的“斗破苍穹”。这样一部神作，如今也是有了他的加料版，值得高兴的是他的加料量大管饱，不过质量就不怎么样了，但是足够你重新回顾一下这一本经典之作。"},{"title":"我家学姐不是人加料","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结纯爱后宫，猫娘，魅魔等等角色多样，刘备花样也很多。原文就是很好的纯爱后宫文，男主个人魅力强，每个女主也有自己的攻略过程，车速也飞快，女角色也有自己的记忆点，比如烧猫，表面冰冷实则病娇的青梅等等，文风轻松愉快，剧情舒缓，总体十分很值得推荐的，至于加料，锦上添花，短短几十章，质量很好，因为好像就是作者写的对应章节的番外。"},{"title":"末日了，身边都是丧尸加料","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结纯爱后宫，男主无敌，经常多p，玩法多样。原文质量可以，男主自身无敌，自己的血也可以帮助女主们进化，萝莉，御姐通通拿下，海战空战也不在话下，跟其他末世文相比，本文的男主看起来比较舒服，没有那种刻意的冷血，对待女伴也是比较尊重的，而不是当着性奴之类，情感的部分也不错。不过就是后期的剧情有点离谱。本书的加料也是难得的全文加料，加料质量可以，阅读体验直线上升。总结十分推荐喜欢末日和都市的人观看。"},{"title":"《娱乐春秋》加料版","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"春秋也是纯爱后宫的顶尖神作了，吧友们谁又没读过春秋呢。春秋好就好在有情有意，还好在他是一本有情的调教文，把三无的剑仙少女调教成在宗门大会上塞着跳蛋主持会议，而且这位女剑仙还是自愿的，这不是很刺激，直接冲爆。而这种情节本书还是很多的，加上加料，不输一般的刘备。此外作者姬叉是我很喜欢的一个作者，他的《韩娱之光影交错》《娱乐春秋》《问道红尘》《乱世书》我读过，都是一顶一的作品。在如今后宫文衰落的时代，还能有这么一位后宫大神产出优秀的后宫文，实在是不容易。"},{"title":"秋之家系列","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"纯爱都市后宫文 文笔剧情都很不错，各色女角色都有，主要是集中在男主的妻子姐妹等血亲，而且作者玩的花，姐妹花、母女丼、双胞胎等等，顺便说一句作者写的新作就是性爱自由的江湖，那本我给了9.3分高分，主要是那本世界观奇特，本文基本没有剧情，全是男主与母亲姐妹的日常，喜欢慢节奏的推荐观看。"},{"title":"惊弦音","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"纯爱后宫兄妹文，同时还收了母亲，作者古月山人也是萝莉和熟妇老手了，《棉花糖》《正心歌》也是他写的。跟上一个秋之家类型，好看主要内容是男主是兄长与妹妹和她的几个朋友的后宫生活，最刺激的就是经常子宫交，妹妹们最喜欢的就是子宫承着金叶。那种反差好冲。"},{"title":"今生我爱你两次","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"最纯的纯爱，男女主都是初处，充满了青涩和懵懂，外加转世轮回的亮点，当然也有了涩气的描写，满分的短篇纯爱神作，看完都感觉被治愈了。"},{"title":"喜欢你和她们加料","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇都市纯爱后宫，知名度比较高的都市后宫文。主要看点就是剧情和人物，这本加料就是聊胜于无（因为基本没适配）在剧情方面是前期将女同掰正，后期在几个女主间周旋。亮点是本来男主是接了女主母亲的任务攻略本来是女同的女主，女主一开始还说打死也不会喜欢男主，结果到后面就真香了，发现男主依旧是在做任务，就反向舍下面子追求男主。最绝的是男主还跟女主的母亲，女同伴侣也谈上了所以这个情节很刺激，挺好玩的。人物方面描写的都很好，女主妈妈墨姨更是绝绝子，这就是正经文的角色功力。缺点是女主们知道自己不是唯一时都很痛苦，不过到后面慢慢接受了。"},{"title":"我将埋葬众神","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"注意不是那个完结的长篇，而是长篇几十万字的剑剑小说纯爱后宫同人，集合了《我将埋葬众神》，《神国之上》，《琼明神女录》三部小说的男女主，以《我将埋葬众神》的男女主为主，写了长达几十万字的同人，难能可贵的是，都是纯爱，而且文笔也有作者的味道，同时玩法也很多样，最难能可贵的没有原破坏人设，你说这是作者写的二创，我都信。此外，最感动的就是能看见前两部作品人物的出场，特别是琼明，看着他们如今美好的生活就感到舒心。说实话，主要是因为琼明不管是原著还是同人大多都是绿，看的老难受了，所以为写这篇同人的人点赞。还有就是剑剑已经好久没更新了，换的那个马甲也没更新了，说实话我很喜欢剑剑的故事，我也很喜欢琼明。总结喜欢剑剑小说的必看。"},{"title":"女校先生","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，都市纯爱后宫，一本经典的纯爱后宫文，内容就是以前的经典套路，男主暗藏身份，到东京学校里教学生，然后与学生结识相爱。这个过程中也会出现反派，然后男主的本领展现出来拯救女主等等。整体上文笔不错，刘备的部分花样也不错，有一龙多凤等等，剧情发展也算连贯，一卷跟着一卷，此外感情方面，男女主们之间是互相喜爱，有感情戏，属于真正的纯爱后宫。不过就是有点套路化了，后期我看着有些腻了。只能说在没有多少套路的时代，他值得更好的评价。总结喜欢都市纯爱后宫的可以观看。"},{"title":"我只想认真给她们摄影","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，都市纯爱后宫，车速上约等于刘备，只是没有那些具体词，描写还是很详细的。女主方面，花样繁多，姐妹，青梅，萝莉，傲娇公主等等都有，这些都不错。男主也是收的很果断，当然也是有点感情的。看点主要是各种色色，人物也描写的不错。"},{"title":"《除魔卫道怎么成了除膜慰道》","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"反派母亲是女帝作者的新作，题材是灵异都市后宫刘备，更的比较快。整体质量上，还行，跟前作一样量大管饱，无毒无雷，可以放心看，开头不错，有一些新鲜感，但是后面感觉又回到了老套路，没给我什么深刻印象，文笔也是一如既往的番茄小白文笔。至于角色还好，女角色都挺不错的，这一点还是可以的。刘备方面，一如既往地用力过猛，把做爱过程写得跟操母猪一样，不是说不好， 说实话看一次两次还好，都是这种有点看腻了。总结喜欢后宫刘备的，可以看，没有毒点，这种质量的也不多，看一本少一本。"},{"title":"路边男主的养成方法，未来女儿们的恋爱头脑战","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"连载短篇都市纯爱后宫 父女 刘备，创意十分不错，作者说：灵感来源于16年左右刺猬猫的一本《我为女儿续一秒》，这本书在菠萝包有一本模仿的《我的千金央求我恋爱》，在起点有一本《明星前女友报复我》，都是未来女儿穿越回过去帮母亲攻略父亲的。当时看的时候就觉得这个题材很适合写。我看了一下也确实不错。花样也很多，开局几章就已经父女做了。总结很推荐观看的新作。"},{"title":"《女神代行者》","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"雪大的西幻完美之作，包含异种族，精灵，女仆，魅魔，后宫，纯爱，ntl等多因素，并且很正能量，男主虽然在原世界是个被情所伤的肥宅但是到了异世界还是保留了比较正直的三观，虽然是以吊征服天下，但也不全是推土机。不过也有几个郁闷点，就是前期的女主太过婊子了，就把男主当接盘侠，后期改善了些。"},{"title":"《都市偷香贼》","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"这是雪凡这个重口味大神作品里口味相对清淡的一个作品了。本书的男主形象中规中矩，比较正面。优点是男主与几个女主之间也是纯爱的，算得上纯爱后宫了。女主们的性格也基本是独立自强，没有离开男主就不活了。形象塑造比较成功。在剧情世界观上也是新旧结合的，有异能，有名器。不过雪凡对除了男女主之外的尺度描写都比较大，都能见血，什么强，绿都有。缺点跟上一本一样，更的时间太长了，现在还没更完。好像也不更新了，当时每隔几周我都看看《江山云罗》《六朝》和《都市偷香贼》更没更新，当然大多时候基本没更新。"},{"title":"《调教香江》加料版","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"王大神的文娱佳作，这本书跟上一本北电一样都是文娱征服明星，（我是在看完上一本后意犹未尽后偶然发现这本还有金色果酱加料版）不同的是这本书主线写的更好更爽，主角从偷渡香港成功做到世界首富。但他的感情线比较少，大部分都是推土机式的推女，好处在于有名的港星基本都收了，得益于大佬加料的努力，实际看上去刘备质和量都不错，有时你甚至会感觉刘备加的有点多，挡你看精彩的主线了。本书的主线不只是讲了主角，更讲了香港文娱界的发展，讲了港片的繁荣与落寞，讲了主角如何与当时的影院影片斗争，如何引领港片潮流的。子里行间也能感受到作者对那个时代的理解和追念，读了本书你也算是跟主角走了一遍港片路了。我也是读完这本书开始了解港片的发展。"},{"title":"《琼明神女录》纯爱版","score":9.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"最特别的一本，这是我读刘备史上意义深远的一本。琼明无疑是一本神书，他的知名度十分高，还是老刘备们常推给新刘备们的坑爹之作，每当有新人被骗看了琼明然后道心不稳后，老人们便会会心一笑，因为老人们当年也是这么走过来的。而我则是最早的一批看琼明的，当年看真是开幕雷击啊。《琼明》在我初读的时候，是被他的那股文青味文笔吸引的，我本以为会是一本佳作，结果没到几章，男主的女剑仙师傅就被干了，艹，当时我看到这直接脸都黑了。无奈我接着看，结果后面的女主更离谱，直接被干菊花，我了个艹。总之在前期几个女主都是饱禁折磨，你知道那种看到描写的很好的女角色结果被糟蹋成破鞋的无语感吗。到后面世界观逐渐扩展，剧情发展，发现男主不是师傅，而是其剑的剑灵后，绿的部分逐渐减少，（理论上被绿的应该是女主的师傅但是管他呢），难以想象到后期他又变纯爱起来了，绷不住了。总结下来，凭借其优秀的文笔与世界观构造，以及没有一绿到头的人物，在我心中留下来不可磨灭的印象，至于复读我是不推荐的《琼明》的作者见异思剑在《琼明》的杂谈中也回应了纯爱与绿的问题，我记得他当时说他无意特地绿，我猜他只是想展现角色的悲苦的前半生，在与男主相遇得到救赎后自然不用再绿，也就变得纯爱。最后的结局也是团圆结局。剑剑在写完《琼明》之后就上岸了，换了个马甲写出了纯爱神作《神国之上》，这本书人气也很高，大家一看这个文笔再加上小道消息就确定是剑剑了。不负众望的是剑剑整本书都没有绿，全都是纯爱，而且各种花活没少，剧情也不错。剑剑也有自己的癖好，比如说喜欢打屁股，必有一个白虎女主而且男主在床上还干不过。但是我真正推荐你们看的是纯爱版，我看了这一版，他不是那种简单的删了绿的部分，而是做了整篇作品的改动，从剧情上改变了一切，我是看过原文的，又看了改编版发现原著的绿地方都被删了，做出了不错的改动，还有自己的加料是很不错的纯爱改编。"},{"title":"禁欲的双修试炼","score":9.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"超长篇女性向纯爱仙侠刘备，我也涉猎过不少女性视角的刘备，俗称po文，看了这么多文，发现还是这本量大，md千章刘备，我勒个豆。当然这么长的内容当然不止一对情侣，是男女主一对为主，男主是女主的师尊，是高贵的大神，女主是穿越的皇室女，不过比较普通。此外加上另外两对情侣的故事，当然结局也是女主成为女帝，男主功成名退的圆满结局。至于书名则是男主交给女主的功法，女主练到后来修为也越来越高，但也被功法改造得越来越淫荡，当然淫荡只针对男主，本文虽然也有别的男的喜欢女主，也好像有一些小雷，但是女主是一直爱着男主也一直只跟男主发生了关系。此外本文很长，但肉能站比7成，男主因为女主修炼的功法，会不停调教女主，这时候各种花活来了，比如人前做爱调教（但是他们看不到）三穴齐开，女主登基时做爱等等凡事可以的地方女主基本都在接受调教，日常插着道具，外表高冷其实内心淫乱，很涩很可以冲。当然女主在淫乱之外，也是有智慧有能力的，男主虽贵为大神但很少亲自帮助，大部分时候都只起辅助作用。这就让女主更有魅力。除了男女主这一对，还有两对情侣，他们也有各自的故事，这里就不多说了，总结十分推荐观看，不过看口味。"},{"title":"反派：我的母亲是大帝","score":8.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"这本也是新生代刘备的扛把子，篇量很长，刘备也很大，另一种意义上的纯爱后宫神作。在创意上，他是针对天命主角的反派系统文，前期创意在于各种针对天命主角的奇葩举措，什么退婚了，废材流主角等等都被男主带绿帽了，刘备也很好，成功让你体会到那种在别人丈夫面前玩弄他的妻子的反派感觉，真是又乐又好冲。当然那些女的大部分只是男主的玩物，是妻子的很少。后期作者更是整了许多好活，包裹创作了许多绿帽角色比如“吕茂”这个谐音角色，男主还特意让他修行了越感觉被绿越强的功法，到后期直接成了男同，教育了下一个绿帽天命主角。此外作者还与时俱进，加入了许多如“铁牛牛肉面”“菜徐坤”等新梗，让读者会心一笑。但是之所以不给9分是后期剧情开始有点发病，不知道在写什么，明明感觉到后期了，但是作者还是在写前期的老几样。如今也是完结了。可惜了，终究是有点烂尾，不过喜欢这种题材的还是推荐看的。"},{"title":"《刚上大学，系统说这里是合欢宗》大鹅加料版","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":true,"review":"后宫系统文，连载于车速平台次元姬，原文车速超快，在次元姬也很火，加料之后更是直接的刘备。这本在目前看来还是不错的，他的核心优势是建立在色上的爽，不是那种一眼看到头的神豪类型，是那种征服和调教的刺激，通过一系列手段，让女主们一步步堕落成自己的炉鼎，里面夫目前犯不少，写得也十分不错，在大鹅的加料润色之后更是完完全全的刘备，ntl描写得，还是很色很好冲的。女主方面类型多种多样（都市有的基本都有），有高冷的校花（这个是纯爱），有rbq，有人妻，有教师，有警花，也有兄弟女友等等。玩法发面，三通和夫目前犯也是家常便饭。不过缺点就是没有文笔，很小白，剧情和人物情节也比较老套，而且女主很多都是图财图权的，感觉没什么真正的感情，对于我这种纯爱党来说，越到后面越无聊，不过总体上是一部可以观看的无毒无雷的都市后宫刘备，在当下长篇后宫刘备势微的现在，也是难得的作品了，看个乐，冲几发是完全够的，至于其他的也不用太计较。"},{"title":"仙凡间","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，都市纯爱后宫，半刘备文（保留正经文的框架，作者在必要地方加上了肉。）故事起点是都市,然后过渡到仙一层面，中间包括一段比较精彩的男主无意穿越回清朝的副本。总体而言剧情不错，可以一看。在刘备方面，肉虽然不多但够看，收了很多，包括母亲妹妹女儿之类，这些也是真的有肉。总体可以一看。"},{"title":"《六朝》系列","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"六朝系列是台湾的几个作者联合写作的，篇幅比《妖刀》还长，真正的长篇巨作。几部的起点是男主穿越回另一个古代，这个古代几个有好多国家，属于是基于原时代的架空世界观。优点是量大管饱，即使你抛开刘备的话，单看剧情的话也是比较刺激的，比如中期的篡位登基的。刘备也是可以的。人物塑造也是从始至终的，长线描写。整篇也算是纯爱后宫了。缺点是量太大了，更新不怎么及时，导致我回去看更新的，总是把前面的都忘了，还要重新回顾一下前面，而且几个篇章之间链接的也不是太好。而且现在台湾的几个作者好像也被抓进去了，看不到更新了。"},{"title":"一世青春，一路繁花","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，纯爱后宫，姐弟和姐妹，母女等等女主一家，三通。整体可以，人物，感情，刘备都有，好冲好看，男主温柔善良，形象不错，女主们也是高贵但不高傲，还有小姨子和姐姐，总体十分推荐喜欢都市的人看。但是小的问题不少，比如前期男女主情感太快，后期也有点迷惑行为，但总体不错，姐妹，母女，小姨等等都推了。"},{"title":"妖颜","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"纯爱（个人理解）后宫，剧情nb，人物出彩，刘备还行。最近比较流行的女推男类型小说最强者，主要就是女主勾引男主，男主已有女友本不愿意，但还是没有抵住诱惑最终沉沦的故事，当然本文不止这么简单，他的剧情还带有一些反转，解释了前文，让人感到精彩，同时人物也立起来了，总体上并不是小白爽文的类型，值得一看。"},{"title":"逆行线","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载纯爱后宫，摄影，轻女同，巨乳，萝莉，白虎，道具，tj好看，讲了摄影师和COSER之间的故事，两个女主形象鲜明有特色，男主也比较有魅力，摄影部分也比较专业，剧情，人物，刘备，感情都有，好看无需多言，就是篇幅太短 。"},{"title":"异能与少女收容计划","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，纯爱后宫，很有潜力的一本新书，虽然现在只有十几万字，只出了一个女上司和机器圣女，但是其新奇的世界观，较好的人设，很值得期待后面的剧情发展，"},{"title":"网络行者会梦见赛博后宫吗？","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，赛博朋克纯爱后宫，可以一看，亮点是新颖的赛博世界观，每一个人或多或少都有赛博义肢，男主是类病毒式的网络行者，能够侵入别人的终端系统，能力强大。里面的要素有纯爱，也有调教式的情趣主奴。男主一行人给我的感觉更像游侠，总结可以尝鲜，这个题材比较少见。"},{"title":"退役猎魔人和杂鱼吸血鬼","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇完结，单人纯爱，如题所见，一个纯爱的故事。女主失忆，男主终于在文章开头找到了女主，然后一直陪伴着不知情的女主，后来也是就记忆一事展开了故事。亮点是女主塑造得很好，那种又傲娇又怂的感觉看起来真不错，也在加上刘备（就是不停喊你杂鱼结果自己撑不住了），就更棒了。"},{"title":"翠英皇国的仙术师","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，纯爱后宫，独立世界观，萝莉，大小姐，偶像，皇女，多p情节主要是男主作为小队长，逐渐攻略小队队员的剧情，有种以前日漫后宫的感觉，描写的也很不错，人物刘备都很好。不过有点小雷，就是攻略女主总是英雄救美式的，这就导致二女主险些被qiang，三女主差点被触手gao等等"},{"title":"凌霄仙母录","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠纯爱后宫，这本木子，师徒，狐狸等等，太刘备了，里面的女的见到男主基本都会发情，特别涩，简直能冲爆，同时还能有不错的剧情进行人物塑造，原作者是p站的，写刘备写得不错，很有感觉。"},{"title":"恋上青涩小姨","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，都市纯爱后宫，一篇类似于正经纯爱都市小说的刘备，里面的小姨塑造的是真好，是那种又有傲又有骄的角色，挺让人喜欢的，加上还有肉，不错的体验。不过本文的节奏可能比较舒缓，是那种细水长流式的都市文。总结喜欢都市的推荐观看。"},{"title":"我和我的道家仙子美母们-剑宗篇","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"无绿改","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠纯爱后宫，又是仙侠领域了，原文是仙侠的常见绿文，不过这次有了网友帮改，将她改为了无绿，不过这个改版不是简单的删人物，而是自己精修并添加了许多情节，让她能够摆脱了原版的影响。这个改版是后宫纯爱，男主直接当逆徒，顺便也把师妹等等收了，基本无雷在仙侠文里文笔和情节都不错。总结喜欢仙侠的推荐观看。"},{"title":"混沌神座","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结纯爱后宫，剧情上男主穿越携带混沌四神选的祝福，从开头救下的女公爵领地开始开疆拓土，最后成就神座。刘备上因为男主是色孽的神选，因此各种xp都有，调教女公爵，与人马娘做，母女共侍，调教性奴等各种玩法也都有，可以狠狠地冲，不过开头的肉不多很少，到后面男主开始打地，肉才多起来，总结内容和肉都不错。"},{"title":"仙妻是恶毒女配","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结仙侠纯爱后宫刘备，作者最为出名的一本书，也是作者写的最好的一本，本作的仙妻，人物形象十分鲜明，开头几章就放在当时也是比较新奇的，男主虽然弱，但不窝囊，性格温良，观感可以。男女主之间也是从零到相互信任，互托生死的程度，后期女主还给男主又找了好多后宫，这样的老婆谁不爱呀，就算他是恶毒女配但关我什么事。不过就是最后没有写完，就把大纲放了出来，有些遗憾，但总体十分推荐喜欢仙侠和想了解作者的人阅读。"},{"title":"哈迪与他的魔法少女","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结纯爱后宫，触手，孕产,调教， 道具背景是独特的里番魔法少女世界观，里面魔法少女以魔物的jingye为食，被各种魔物侵犯是常有的事，但不会怀孕。即使是男主的几位精英学生也曾被魔物击败侵犯了一个月之久，反正就是特别惨，要做好心理准备。但是人物以女主的塑造为主形象十分丰富，也没有太多的雷，男主跟女主之间是最纯爱的，男主性格比较冷漠，女主开朗乐观，两人从师徒逐渐发展到恋人，主要是女主攻略了男主。总结推荐喜欢纯爱，喜欢魔法少女但也有防御的人看。"},{"title":"宗门风气不对劲ai加料版","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"中长篇太监，仙侠纯爱后宫，这本并非刘备而是加料的，本文文风偏向搞笑，玩梗玩的飞起，比如小登，老登之境等等，而且不只是主角有活，他的宗门虽然是圣地但就是整活为王，如标题所言，风气确实不对劲，不过可能要归功于创立宗门的二位圣祖之一，总之喜欢搞怪的，值得一看。在人物方面，描写女角色也比较成功，主要是师尊和两个师姐，质量都不错。精彩地方在于本文中有喜闻乐见的冲师当逆徒环节，不过本文师徒是一个时空关系，跟《我将埋葬众神》里面的师父相似。值得推荐。"},{"title":"我的冷艳剑仙师尊","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇太监，仙侠纯爱后宫，半刘备文，肉主要是作者写的对应章节的无删减番外。剧情就是男主在剑仙指导之后，到凡历练，本文的男主温柔正义，因此他的师尊，小姨和女帝等等，都很馋他，然后就发生了很多喜文乐见的事，人物和情节都不错，值得观看，就是好像没有结尾，写到一半就被下架了。"},{"title":"我的师尊今天不太对劲ai加料版","score":8.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇太监，纯爱仙侠纯爱后宫，本文男主是一国太子，皇帝给找了魔门和圣地的魔女和仙女任其选择，当然男主选择了全都要，然后就是魔女卖福利刺激仙女，仙女也不断发福利等等。此外，前期最具反差感的是钦天监监正，表面上傲娇但实际上对男主什么瑟瑟的要求基本都会答应，是最早上垒的，是被欺负的受气包，更刺激的是男主的仙子师尊跟她是长得一样的双胞胎，所以玩的花样更多。不过ai加料质量不怎么样，有内容但是加料的很重复，不过依旧能看就是。总体是十分推荐的。最后就是这本依旧太监了，操蛋。"},{"title":"穿越成魔法少女世界的下流魔物救世主是否搞错了什么","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，异世纯爱，剧情向奇幻纯爱刘备文，虽是p站刘备但是以剧情为主，前期会有很长回忆章节，会揭示男主初穿越到这个世界的故事，这个故事比较凄美，读完记忆尤新。由于剧情的发力，人物也塑造得不错，至于刘备，我感觉是锦上添花，同类就是《哈迪与他的魔法少女》，总结喜欢魔法少女的，重剧情推荐观看。"},{"title":"夫人十恶不赦里番整合","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结仙侠纯爱后宫，作者上岸去起点写的长文。本作延续了作者的一贯特点女强男弱，男吃软饭，男主靠女人征服女人等。本作男主是穿越的，开局就因为守信义赢得了被称为无恶不作的银龙的喜欢，打算与他结婚。后面也是在她的帮助下征服其他女人。不过本作的男主是作者所有男主中形象最好的，跟仙妻差不多，都是正义善良的性格，妻子对他人霸道时，他也会劝阻一二，观感可以。不过因为是正经文，剧情比较舒缓，肉也只有部分的肉番番外，但总体依然值得推荐给喜欢仙侠和仙妻的人观看。"},{"title":"师傅，我真的非常敬爱","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结，仙侠纯爱后宫刘备，纯爱的师徒文，我一直给好评，这篇中等，量不大，肉的量也不大，不过质量还可以，现在纯爱的仙侠文，是看一部少一部啊，总结喜欢仙侠的可以一看。"},{"title":"原来她们才是主角加料","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结，仙侠纯爱后宫文，原文是正经后宫文，不过男主为人不错，艳福也不浅，前期就收了好几个女的，剧情展开中规中矩，情节比较舒缓，女主们的人物形象塑造的不错，总结就是质量一般的仙侠后宫文，不过有刘备加料，不过加料并不是很契合，一般的水平，但是喜欢仙侠的可以一读。"},{"title":"魔女修道院","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，西式纯爱后宫，刘备的部分比起他的体量来说比较少，更偏向正经文。剧情是男主穿越到自己玩的一款游戏里，里面主要是讲7位魔女的故事，这些魔女表面上是修道院圣女，实际上魔女。然后就是男主怎么在此周旋和生存的故事，不过男主开局就说服了一名初见魔女，开局还算顺利。刘备方面正常水平。推荐喜欢看西幻和魔女的看。"},{"title":"美若豆香记","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载纯爱都市后宫文，开局男主就有女友，女友是集团高管，又美又高傲，那种女神感作者描写得很好，这里的刘备就比较带劲了。然后美妇丁阿姨诱惑男主，男主满足了她，接着她又帮助男主攻略了许多血亲，这个过程很涩。当然被女主知道后，女主也生气过，不过还是被肉服了。不过文中女主助理是个女同喜欢女主，不过也被男主将其与女主双飞了，还可以。总结喜欢都市的可以一看。"},{"title":"NTR女主从书中跑了出来","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，都市仙侠纯爱后宫刘备，虽然书名里带ntr字样，但其实是无绿纯爱后宫，书中还出现了母上攻略的人物。剧情上就是男主是个刘备文业余写手。当他给神秘的神豪‘日天’大佬写NTR定制文的时候，正准备把九州大陆最强者之一的女宗主对一个老汉春心萌动之际...，女主出现在他的房间里，持剑架在他的脖子上：“你敢写我爱上那个男人，我就杀了你。”这段描写跟鸡叉的那本非常像，前期故事情节也差不多，不过到后期本地世界观展开，内容就十分有新意了，不过直到现在男主也没有攻略推到女主，比较慢热纯爱，不过男主私底下也尝过荤。总结喜欢仙女的推荐观看。"},{"title":"有桃夭夭","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠纯爱后宫，作品偏向剧情，刘备部分不多，走的是精品文的路线。男主是少年孩童，主打小马拉大车，文章开头写男主去百花门寻找某物，不过不久就已经点名男主有好几位妻子，她们暂时以分魂的形态陪伴男主，不过依然可以与男主交合，前期的肉戏主要就是这部分，并开始一一介绍女主，对男主进行倒叙。不过目前主线就是百花谷探秘，节奏比较慢热，在这其中也结识了当地的女主。总结推荐喜欢看小马拉大车以及仙侠的看。"},{"title":"全族命根子","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，历史架空后宫，开局男主穿越就是要被砍头的危险局面，之后男主凭借前世的法医经验，结识贵人，帮助官府破解疑难凶案，成功免死，整个过程体现了男主机智果断，不过这个过程漏洞挺多的，只能说不细究还能看。后期有点低走了。本书除了特色的剧情之外，他的文笔也不错，尤其是描写女性时，那种表面冷傲实际上处处透露着闷骚的感觉也是很绝的。（可能是作者是p站的吧）至于后宫方面，男主以强势的手段和魅力也攻略了不少，肉戏方面也不错。总结推荐喜欢新意和反差的可以看看。"},{"title":"缚仙宝典","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载仙侠后宫，怎么说呢，这一本很刺激，很好看，但不是因为他是后宫或纯爱，而是他将戴玉棒，打阴环和乳环等等你能想到的所有色情玩法跟修仙结合，修为越高的女的，身上带的东西越多，也越涩。但就是这样的装扮，没有仙子觉得不对，这种反差感一般只存在于幻想中，但作者将她写成了小说，我只能说冲爆。但我不推荐纯爱党观看，因为TM到处是雷，男主有几个师姐，大师姐被看光过，二师姐被魔教强奸过，连灵魂都被练成了飞机杯，不过也是被救了回来，还有其他等等大雷，我只能说这本书只能看后宫和各种玩法，纯爱党就没有必要看了。"},{"title":"仙侠世界的和平之梦","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载仙侠纯爱后宫刘备，刘备方面可能有点微重口，有几个女主是残疾，所以身体存在义肢，做的时候可以拆下来。剧情方面就是男主是宗门师兄在剿灭邪教时意外得知了自己的身世，获得了伏仙印，收了师姐和师妹几个做了性奴，不过她们在心底里也喜欢男主，然后就是她们作为性奴有不同的性癖，比如有人比较喜欢饮男主尿，总之就是玩法比情感占比还重的仙侠文，喜欢仙侠玩法的可以一看。"},{"title":"《妖刀记》","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"长篇完结，武侠后宫，特殊的一本《妖刀记》我想这本书我们吧里的人不说读过起码都听过，我当时初看也是好几年前了，当时我认为这么有名的经典应该写的很好吧，看后写的确实不错，但是对于纯爱党来说毒到能拉出去毙了，后宫有但不纯。整本书那种传统的文青的风味贯穿始终，不然你很难写出到后期主角团依旧有被团灭的经历，连女主都差点被绿，给那时的我留下了深刻印象，我感觉没有必要，就跟金庸没有必要写小龙女被尹强，杨过被绿。至于其他的文笔，剧情，世界观，确实足够庞大，但另一方面也晦涩难懂，到后期支撑着我看完的就是看有没有什么刘备。不过确实刘备很好看。最后男女主方面，前期基本上从情到刘备，中后期女主就基本没有一个处的，都是久经沙场的女的，毕竟那样一个江湖，大家对于贞操不怎么看重，远没有利益重要。"},{"title":"《江山云罗》","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"长篇完结，武侠纯爱后宫，这本是我看刘备文最初看的几本，这本也是旧时代长篇经典。优点是男主角为人正面，有情有义，文笔很好，剧情还行。男主收了母亲，师娘，师妹等等，男主也是多爱熟妇，少女较少。年少不知少妇好，错把少女当成宝。缺点是经典的毛病，男主收的熟女都有些雷，比如那个师太，以前是个兴奴，总有可能被雷的倾向。还有就是这个刘备描写虽然好，但是容易看腻。最后就是更新太慢，更了好几年还没更完，但现在更完了。也算是如今的回忆了"},{"title":"《男欢女爱》","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"长篇太监，都市纯爱后宫，这本书是比较接地气的刘备文，也是经典时代的作品。本书从乡村开始着笔，男主也是乡村土娃，天性调皮捣蛋，男主虽然普通但有一个老头教他功夫。前期男主基本上就是与农村妇女，其中最出彩的就是他攻略季小桃这一县护士的情节，还有到后面攻略大学生村官的柳冰冰。中后期则走出来乡村迈入县城继续猎艳。在这之中，柳冰冰是男主最爱的人，也是前期花了最多篇幅描写的美女，那种城市美丽高材生与乡村土少年的反差感还是很吸引人的，也让我至今印象深刻。但如果以正常方式，男主基本不可能攻略女主。因此作者让女主陷入困境，以身体的代价寻求帮助救治母亲，然后在这途中让男主截胡。但是总的来说还是强的，所幸男主在这之后真心对待柳冰冰，最后让她幸福地怀孕了，也算是先上车后补票了。整本书也差不多这种套路。另一方面本书描写的社会比较细节，也穿插了作者对于男女欢爱的观点，让人看下去能体会到那个农村社会，县城社会。总体上是后宫类，纯爱含量较少。不过比较可惜的是最后好像也没有结尾"},{"title":"修仙者没有情欲加料","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结，仙侠纯爱后宫，特点是这个世界里修仙者没有情欲，也基本没有男女意识之分，只有在突破境界时才会体验到无上快感，继而努力修炼，但男主不同，男主跟她们能让她们体会到只有境界突破时的快感，由此男主的艳遇开始。原文没有那方面描写，加料补足了这一点，不算很突兀，但是很恶心的是tm加的料里居然还有绿，md这个加料也是神人。里面塑造的人物也不错，比如三无仙子，病娇舔狗，圣地圣女等等。不过剧情质量不怎么样，难以细琢磨。总体推荐喜欢仙侠玄幻的人一看。"},{"title":"《美女养成师》","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"超长篇完结纯爱后宫，世界观越展越大，低开高走，刘备还行，整体偏向保守，没有道具tj等等优点是量很大，有几千章，剧情不算出彩但是能看，不至于尬得抠脚，人物形象也可以，看完也能有几个记得住的，世界观到后来越来越多，涉及异能等等，观感还行，不然也不至于写好几千章缺点是前期有点普通无脑，比较现实，而且有几个大雷，就是男主的前女友和室友都跟人做过多p，因此男主和前女友分了，虽然她们之后都没有找其他男人，但是确实膈应。（后来都收了）还有就是前期熟妇比例很高，因此还有换妻等人设。到中期设定展开，男主观感大幅提升。不过剧情还是不能细究。最后有个有意思的点，男主一直都知道后来的一切归功于异能的实力，女友找他复合可能也不是真舍不得她，而是看重他的财富和手段，这个世界一直很现实。"},{"title":"我的隐蔽做爱xp系统","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结纯爱后宫，好评前面主要推了妹妹，与妹妹在许多隐蔽地方做ai，挺刺激的。后面又退了妈妈等家庭其他血亲，没有什么曲折剧情，作为手冲文还是非常不错的，特别是对于妹控一类来说。"},{"title":"那些年属于我的校园女神纯爱版","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇纯爱后宫，女神类小说的经典，好冲很好的作品，剧情，人物，刘备都很好，原著是女神恶堕文，看着描写这么好的女神被污辱，说实话还是犯恶心的，但是幸亏有大佬进行纯爱改版，虽然还是有点雷点，但是瑕不掩瑜，主要是原著描写刘备的画面太好冲了，像攻略校园女神白月光这种，可以说每个男人都曾想过。"},{"title":"重活了加料","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"经典长篇都市纯爱后宫，是大神尝瑜的力作。书籍评价很高，主要是他的人物描写的是真的好。本书的核心人物是夏晚秋，作者用深厚的笔力塑造出了一个傲娇可爱又威严的夏晚秋老师，她的人物生动，让我印象深刻到至今我还记得文中关于她的描写。但成也萧何败也萧何，夏晚秋塑造得太好了，但这本又是后宫，男主还是个不算太废的废物，导致单谈没抵住其他女的诱惑，开后宫到结尾也没成功开起来，就是比较恶心，你就算抵御不住诱惑，那你起码把后宫开好啊，结果结局就是女主跟其他女的一直吵架，绷不住了。所以很多都市后宫文就注定要让女主付出一些代价，你要么容忍，要么离开。比如我真没想重生里面的萧容鱼和沈幼楚"},{"title":"花开易折直须折","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结，都市后宫刘备，很纯粹的调教式ntl文，男主长的还行，关键是有钱有耐心，主要是给我们展示了如何攻略一个有男朋友的女主，挺细致的，有过程有细节，顺带还攻略了她的姐姐和姐姐的女儿。无绿，基本无雷。不过里面包括主奴调教，还有穿环纹身。结尾部分很精彩，作为纯爱战神来说，前面所有的章节都是纯粹的ntr别人，基本没有纯爱，但是最后一章，男主在经历生死考验后，也逐渐稳重起来，对待女人也不再以性奴的视角，而是以相伴余生的夫妻来看待。这个成熟稳重的男主我喜欢。而在历男主舍生忘死的保护后，女主们也意识到，男主是真心爱她们的，也就真正的喜欢了男主，最后也是纯爱后宫美好结局，男女主们和他们的孩子平安幸福地生活在一起，这个结局我很满意，不是那种恶心人的结局，满分。总结喜欢调教和ntl的推荐观看。"},{"title":"那山，那人，那情","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，都市后宫，剧情上男主家庭贫苦，农村长大，一朝考上大学要变凤凰了，离开家乡去大城市，也学有所成，然后就有大娘来给自己“人生新体验”，还和师母暧昧，还引得母亲情不自禁，后面为了增加剧情冲突，写了一堆商业上的事。作者说：故事的整个基调大概要比山海情这部电视剧的年代还要往前一点，这也是看了山海情之后的启发吧，大纲就是一个从山里出来的娃娃带领着家乡人脱贫致富以及自己走出山窝奋斗成长的故事，当然，既然发在这里，那其中的色情描写定然是少不了的，只是不会占据太多的戏份，该有的都有，构思故事情节我也尽量安排，好让故事看起来尽量的真实，真实到可以发生的情景，用一句话来讲述就是，讲一个好的故事，然后安排尽量合理的肉戏，就是这样了。个人体验上前期写的可以，真实自然，后期开商业那，推女就有点推土机了，不过总体还可以。总结喜欢这种乡村到都市的可以一看。"},{"title":"仙侠艳谭","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，仙侠纯爱后宫，著名量大写手七分醉作品，七分醉的作品虽然质量一般，但是人家量大，而且写一本完结一本，很多刘备虽然写得好，但是很容易太监了。这本应该算是七分醉最有名的作品了，剧情和人物虽然不说出彩，但也有一部玄幻小说水平，情感方面也不是推土机，有感情戏，而且无雷无绿，我好久之前看完的，虽然没有留给我什么深刻印象，但是阅读体验还是不错。结局也是大圆满结局。总结喜欢仙侠的可以看看，当手冲文也是不错选择。"},{"title":"枫言梦录","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，都市后宫，无良又一作品，不过这跟前两部不同，这本是构想有趣的未来世界，这本目前只更新两卷，第一卷构想的是精子货币化的世界，男主需要将精子射给妈妈和妹妹，给她们当着钱使用。第二卷是构想男主是未来存在欲鬼的世界的除鬼师，男主需要射出除鬼师特有的超强阳精来驱鬼，同时欲鬼还会散发性激素，周边的人男主也会性处理。总之两个故事脑洞和文笔都不错，都挺好冲的，也没有作者的屎尿屁，就是有点短，推荐喜欢脑洞的都可以看看。"},{"title":"枫言现录","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，都市纯爱后宫，枫言异录前传，叙述的是言枫在现世界的成长经历，从小时候的懵懂无知，到后来偷吃禁果，最后彻底打开新世界的大门，利用稚嫩的外表和成熟的心理，小到幼女萝莉，大到成熟少妇，皆被他玩弄于股掌之间...本系列主旋律依旧是足控，其次是乱伦，主要人物从萝莉、少女、到少妇都会有。不得不说作者的文笔还是不错的，那种小时候什么也不懂，然后逐渐觉醒对于性的探索这一部分写的很有感觉。尤其是与姐姐等等同样不懂的人一起探索的感觉禁忌感拉满了。但是本书也有作者一贯的微重口性癖，也就是老写屎尿屁，本文男主也不例外，从第一次喝了姐姐同学的尿后，此后经常喝喜欢女生的尿，难蚌。除了尿，还喜欢人家换下的内衣，只能说有点重口了。总结推荐喜欢都市乱伦，不介意喝尿的可以观看。"},{"title":"枫言异录","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，异世纯爱后宫，无良枫言三部曲第一部作品，主要讲的就是穿越异世界然后不断冒险的故事，剧情和文笔都不错，属于正常小说水平，感情戏也有一点，不是无脑推女。不过本作的刘备部分，有很多屎尿屁存在，就是男主不介意喝女主们的尿，作者也多次写喝尿，还有就是脚臭，雌臭这方面也很喜欢，这种看个人吧，有的书友就很喜欢，个人感觉有点难评。最后总结喜欢异世界后宫的，同时不讨厌作者性癖的可以观看。"},{"title":"触手怪的漫长旅途","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，触手，纯爱，后宫，精罗，硬核西幻。剧情是一个关于地球社畜穿越异世界成为触手怪，在鼓足勇气准备探索外面世界时，意外邂逅自己的真命天女，从此与她踏上冒险之旅的故事。历史爱好者+精罗的自嗨文，世设基础框架是现实中的罗马共和国，但时代是中世纪，因此风土人情略有出入。内容跟标题差不多，是漫长的旅途，剧情慢热，前期play较少，后宫内容在中后期才慢慢展开，需要耐心观看。总结喜欢触手，西幻罗马的推荐观看。"},{"title":"赘婿的荣耀","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"经典长篇连载 ，都市后宫文，量很大，足足几百万字。在内容方面是赘婿复仇文经典套路，入赘的女婿受到来自岳父母 小姨子 大姨子的无情嘲讽，然后获得了系统开始复仇的故事。主要是依靠系统的帮助来推倒岳母/小姨子，所以有点无脑，不过攻略小姨子的部分还是有自己的操作的，还是可以的。在文笔方面作者的文笔确实可以，也是老作者了，日常生活部分舒缓自然，肉文的描写比较细致，玩法多样。而缺点就是比较无脑，套路老套，装逼过多影响观感。总的来说喜欢都市复仇爽文的可以一看"},{"title":"女神攻略调教手册","score":8.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇烂尾，都市纯爱后宫，这本也是真的遗憾啊。本作前期写的还是很不错的，剧情虽然老套但是写的不错，爽感充足。在女主方面，男主老婆一家的美女写得都不错，特别是傲娇小姨子温岚，与男主很多拉扯写得十分好，写了1千多章还没有推。不过本文你看到1100章左右就可以了，到公司那段剧情那里应该是换人写了，（有段时间停更了更久，猜测应该是进去了）这之后的不用看了，续写的人连之前写的部分都没看过，之前写的人全没了，前面写的人物伏笔等，后面都不会再出现，写了1000多章小姨子都没推，就连怀孕的老婆都能写得没怀孕 而且也基本没戏份了，太可惜了。后面根本就是另一本书 而且也不好看，文笔很差。最后总结，喜欢都市后宫的推荐观看，可惜烂尾了。"},{"title":"剑灵","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，仙侠后宫，男主生活在一个修仙小派，不过他的艳福不浅，身为最小的师弟一直被两个师姐宠爱榨精，一个是萝莉精灵，一个是大师姐，都是男主的炮友，玩的花样很多，开头就是大师姐本来想榨精让男主起床，但发现师妹已经先一步疯狂的女上了。总之他的肉戏因为是p站作者写的，色爆了，十分好冲。不过没过多久。门派便被仇联合内门叛徒灭门了，只能说男主开始了复仇之路。总结喜欢仙侠的可以一看。"},{"title":"母狗偶像是传奇！","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，都市感情后宫，怎么说呢，本书也是比较有新意的新作了。内容如标题所言，男主有一条母狗偶像，不过与其他一般的主奴调教文不同，本文的男主是重生的，男主一重生凭借重生给的容貌和音乐天赋，努力攻略了前世是音乐偶像的女主，这段时间还是纯爱，后来男主因为某些事遭到打击放弃了音乐，但是害怕女主离开他，就开始调教女主，给她打乳环，印奴文，一直讲女主圈养起来，女主爱着男主也就接受了。这个阶段就比较出生了。但是总体上来说男女主还是相爱的。不过这些是前文，主线是男主挣钱做游戏，女主为了支持男主一边做福利姬挣钱（不过这个后期逐渐没有了），一边也得到男主支持，努力为舞台偶像这个一直以来的梦想努力。当然男主除了女主之外还有两个性奴 ，一个是女主她妈，还有一个也是美女，不过男主的口味不敢恭维，他喜欢又肥又厚的烂熟逼，还特地给女主那地方打药，我只能说难评。其他的雷点也很多。总结一部比较有感情戏的后宫主奴调教文，推荐感兴趣的看，雷还是很多的。"},{"title":"后宫才能幸福","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇纯爱后宫小合集，有趣点是男主推了女主和女主闺蜜，女主被绿了，之后还被男主双飞了，挺好看的，虽然没有多少剧情，但是纯爱加肉也不错。"},{"title":"道母笔记","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"玄幻仙侠后宫，是唐朝加上仙冥的世界观，不过已经太监，但是前面写的不错。在车速上约等于刘备，只是没有那些具体词，描写还是很详细的。其次本作主要是年上，事实上男主有好几个对他十分宠爱的妈妈，不过前期的男主不知道。里面比较有趣的是，男主与妈妈之间的暧昧拉扯。第一女主就是道母，也是与男主真正意义上的母亲，男主与其的拉扯最久也最耐人寻味，当然除了后期与几位母亲外，前期男主主要是与唐朝公主相爱，里面的描写也比较详细。"},{"title":"川清","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"清仙阙","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠纯爱后宫母子 ，行文一种半白半古的风格，需要看个人，剧情方面不是纯粹的爽文，节奏比较缓慢，带点古早仙侠剧的感觉，前期的肉也比较少，推母的进程比较慢。女主方面，母亲和其他女主塑造的还不错，挺有仙侠的味道。最后总结喜欢看仙侠母子的可以一看。"},{"title":"正道邪修","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，纯爱仙侠后宫，乱伦母子。剧情方面就是男主年少身弱，结果被魔头在她外出的时候掳走，后来被魔头洗脑忘记了之前的记忆，她母亲和养母悲痛欲绝。主线就是母子相遇之后，已经失忆的魔门男主与正派母亲之间的故事。整体剧情节奏比较慢，并没有立即相识，而是经历了很多事情后才开始，属于慢热型，看着不是很爽。不过文笔方面还可以，女主们塑造得也不错。总结喜欢仙侠母子的可以耐心看看。"},{"title":"穿越到全都是弱智的世界","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"连载中，目前仍是短篇的搞笑玄幻后宫文，说实话我挺喜欢这么有新意的刘备，全是弱智指的是学习知识方面，在这个世界，你只有答出女生身上的三道题才能解锁然后做，而这些题目都是很简单的题，范围包括语数英等等，当然男主一看都会，爽点就在这。男主凭这个也艹到不少天之骄女。"},{"title":"仙路征服：乡野少年的修仙之旅","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，仙侠纯爱后宫刘备，女主包括清冷剑仙大师姐，魔女二师姐，两个女主各有特色，刻画得也不错，男主是个淳朴善良的乡野少年，与师姐们之间也谈不上攻略，就是两师姐被男主的行为感动了，描写的不错，有个雷点就是二师姐作为魔女是被女师父救下的，所以是个破烂了，靠。总结喜欢看仙侠刘备的推荐观看，整体还是不错的，虽然有点雷。"},{"title":"混在女帝身边的假太监","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载的古代后宫文，优点是量大管饱，已经有一百万多字了，人物也很多，与女帝之间的互动也不错，不过就是女帝的含量还是比较少的，女帝还没有正式推到，男主大部分攻略的都是宫里的其他女的。至于质量我只能说中等，没有什么特别出彩的。但也没什么雷。总结喜欢这个题材的可以看看。"},{"title":"我的母亲是狐妖","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"连载短篇，仙侠纯爱后宫刘备，肉含量很高，没什么剧情，但是写得不错。玩法主要是年上流，小马拉好几辆大车，小马还比较纯真，大车则是情趣意义上的坏女人。总结喜欢年上的推荐观看。"},{"title":"勇者成为女魔王之子","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"韩国长篇完结，西幻纯爱后宫刘备，剧情是男主作为勇者被队友背刺，但是女魔王与其约定，将其复活成自己的儿子，然后勇者在成年之后再次回到人类社会复仇的故事。女主方面很多，最主要的是一心喜欢勇者的女魔王，算上年上，还有等等。刘备的内容也不少，长剧情加上不少的刘备，整体不错。总结喜欢西幻和后宫的推荐观看。"},{"title":"与银发美少女签订了奴隶契约","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"韩国完结长篇，西幻纯爱刘备，虽然书名上说是男主是奴隶，但实际上真正的主人是男主，女主召唤男主是为了给男主当性奴隶，这个世界观就是这样神奇，甚至说那个奴隶契约可以说是婚书。剧情上是女主是学院的女生，展开了一系列学院剧情。整体上是男女主一对一纯爱，当然这是韩国作品，也有点雷就是后期男女有过公开直播等等。最后推荐喜欢新奇的可以观看。"},{"title":"开元风流","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇太监，唐代纯爱后宫，在起点的尺度算很大了，可能也就是这点太监了。男主穿越的是唐朝的王维，一路顺风，收了不少女主，包括当时的公主，女主刻画的都很不错，基本都有感情戏，文笔不错，开车也开得飞快。总结喜欢车速飞快的历史文推荐观看。"},{"title":"齐天阙","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，历史架空纯爱母子后宫。男主是大齐皇子，开局就袭击敌营，展现骁勇，整体偏向剧情，肉一般，至于男女方面感情线除了母亲之外，都不怎么足，第一卷母子写得很好，鉴定为母子文。整体质量还是不错的古风母子文，推荐喜欢母子的看。"},{"title":"临海血缘","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，都市后宫，乱伦，母子，故事发生在一个神秘的虚拟国度东夏国，市公安局长因公殉职，家族政治斗争风起云涌，孤儿寡母在激流中如何上演恩爱纠葛，家族复仇之路何去何从...剧情流，文笔还可以，不过这种复仇的比较看个人防御，因为不是纯粹的爽文。在女主方面，开局没多久就开始推土机了，家里女人全喜欢他，激情之后就完全爱上了男主，感觉有些千篇一律了，不过描写的还行，后面也逐渐攻略了最重要的母亲。整体是质量还可以的都市后宫文。总结喜欢都市后宫血缘的可以看一下。"},{"title":"龙族--欲与操之歌","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，龙族同人，说实话很少见这么长的龙族刘备同人了，有60万左右的字数。前期在第一部原著的基础上加上不小的修改以可以，性转了凯撒，楚子航以及路鸣泽。弥补了不少遗憾，笔墨比较多。不过到了第二三部，节奏就明显加快了，而且能看出是借鉴了其他同人作品，融合的不是很好，有些莫名其妙，主要是二三部融合了起来，剧情逻辑不足，作者的笔力还是不够。但是最后还是个大团圆结局。总结属于中规中矩的龙族刘备同人，不过喜欢龙族的推荐观看。"},{"title":"小马仙侠ntl","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结极致的仙侠ntl文，男主一穿越到仙侠世界，就因为自身是纯阳之体被两对人争抢，因此本文分为两部分，第一部分是仙子，男主被仙子老公要求与仙子双修，男主也不付他望，在师父闭关期间上了师娘，然后就是各种夫目前犯，第二部分是女帝篇，男主服侍完师娘后按照约定来服侍另一波人女帝，也是在女帝老公面前夫目前犯。本文刘备量大管饱，保证你ntl看的爽。总结喜欢仙侠和ntl的必看好吧。"},{"title":"仙途百美录修改版","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载原版是仙子老头文，修改版改为了中年人，女主数量很多，仙子，魔女，帝女，医仙，侠女等等，不过质量描写方面还是差了点，比不上仙子修仙的铺垫长，这个是开头就上了，不过因为女主太多了，篇幅短可以理解。总体依旧值得推荐给每一个喜欢仙子的人。"},{"title":"答应青梅女友婚后初夜，我却在她不知道的地方被痴女们不断榨精","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载纯爱都市后宫刘备，如题所言，全文没什么剧情，都是刘备，描述也是浓浓的p站味，各种女的ntr女主，包括她的妹妹，女班长等等，男主就是人性魅魔，不过刘备方面写得很好，总结就是一篇很好冲的手冲文。"},{"title":"从美丽的室友开始","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇纯爱后宫，姐妹起飞，野战，道具等等，属于是既纯爱有刺激的刘备，值得纯爱党一读，喜欢tj的也可以，缺点是男主有点怂。"},{"title":"《娇娇师娘》","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"长篇完结，以及他的同系列之作《娇娇倚天》和《娇娇娘子》，三本中我感觉《娇娇师娘》最好看。这三本都是量大管饱的类型，刘备特别多，剧情的话就是最普通的小白文，甚至这个剧情是为肉刘备服务的。因此我当初看看就不想看了，有点无聊。但是都是纯爱和后宫，收了许多女的，当然有情的很少。综合下来，你可以把他当成闲来无事的手冲之作，不建议长期阅读。"},{"title":"成龙历险记的恶魔大姐姐","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结纯爱后宫，男主超强推土机独特的世界观，基本上原著的角色都变成女的了，龙叔直接变成泷姨，老爹变成老姨，绷不住了。男主是恶魔，开局就攻略圣主，自身就跟魅魔一样，整天做，后期有了符咒，更快，无限火力，还能将人变大变小，花样繁多，但是没有直接描写，不算真正的刘备，不过里面也没什么剧情，完全就是推土机，不是刘备胜似刘备，最后值得观看，没有毒点。"},{"title":"邻居家的榨汁姬","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"p站上的中短篇小说，纯爱后宫加调教。emm纯爱加调教，感觉挺微妙的，因为大多数调教文，男主对女的基本没有感情，想怎么玩就怎么玩，虽然尺度大花样多，但是纯爱党看着真难受，那种把女人当奴的感觉有点难受。而这本书虽然还是有调教文，但还是加入了一点纯爱成分，让人更加容易接受。篇幅虽然不长，但是前后攻略了女主和她的妹妹和母亲，而且还是女主自愿的，也算得劲。长篇纯爱后宫，母女三人，主奴调教，三穴齐开，乳汁，道具等等，玩的很花剧情无脑，刘备描写的很好，量大管饱，很适合手冲。"},{"title":"爸爸，我愿为你今世的情人","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"纯爱父女文，如标题所言，是女儿主动联合闺蜜攻陷传统老爸的故事，女儿那种主动感，爸爸那种忧郁感的拉扯描写的很好，当然最后是美好结局。"},{"title":"晚秋","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，修仙式纯爱后宫文小马拉大车，10岁起驾，剧情方面主要都是围绕着亲娘女帝，义娘师尊和小师傅这三人，核心是乱lun，挺好看的，没有毒点，就是太短了."},{"title":"玫瑰与繁花","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇西方纯爱后宫刘备，作者是知名的《仙妻是恶毒女配》的作者，这位作者一向喜欢写高贵女神被低下男主做时那种讨厌但又无可奈何只能顺从的反差感，经典就是女的一方面嫌弃她的孩子的血统被男主玷污了但另一方面又要坚持给男主生孩子。这本也是如此，世界观是偏西式的，有贵族和平民之分，男主是穿越成的又矮又弱小的平民，不过本文男主有些特别，他待人是真不看颜值，他身边有个从奴隶市场买的长的很丑很难看的女奴，他待她很温柔，从不嫌弃她丑陋，男主的温柔也赢得了她的心意，后面在男主的帮助下，她摆脱了诅咒，重新成为半神，不过我也是佩服男主，贫贱不弃是真的强，他有回报是值得的。后面就顺理成章了，在半神的帮助下，男主就不停攻略高贵的富女，抢走别人的妻子等等。总体上ntl和纯爱都有，情节也有意思，值得观看。"},{"title":"春秋风华录后宫版","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇仙侠后宫刘备，最大的特点是各种仙子，不过原版是纯恶心人的绿文，后宫版修改了很多，基本没有绿和雷了。后宫版换了男主，本版男主是个枭雄，有手段也有柔情，攻略仙子时会强但不暴力，男主总体观感不错，虽然也不算真正纯爱，但也不至于把仙子当真正的性奴。此外，众所周知，仙子文描写仙子一向是最给力的，本文也不例外，因此本文的女性描写的都很好，刘备场景也很有冲头。总结就是喜欢仙侠和仙子的，推荐一看。"},{"title":"正心歌","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"作者：古月山人 纯爱后宫（被迫后宫）李文，篇幅不长，大车压小马。 老作者了，棉花糖、惊弦音都是他写的，写作风格深得我心啊。可爱小正太被自己mm、邻居阿姨、老师等一众熟女连皮带骨吃干抹净，逆推元素很足。可能郁闷点：传统正太不科学发育，自然有出戏的地方，有违和感。但我觉得只要够涩，让小头控制大无脑冲就完事了，管那么多干什么。"},{"title":"沉舟侧畔","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，纯爱后宫武侠类。文笔剧情都很好，不少女角色刻画的比较细致，作者善于用语言及神态描写去刻画角色。目前1-2部完结，篇幅较长接近100万字。可能郁闷点：推的有点多了，侠之大者，弱水全收，可能会审美疲劳，角色多了以后笔墨不匀几乎是注定的。另外主角师傅还收了一个伪娘徒弟，虽然笔墨不多，还是希望作者未来不要踏上一条至暗的不归路。"},{"title":"我的妹妹超可爱二改加料","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"长篇完结，都市纯爱后宫，著名的妹妹文，描写妹妹描写得很好，顺便还收了前女友等等。不过有门槛的是本文有很多打lol还是王者的内容，以游戏串起了很多，不过不玩游戏的看着有些无聊。还有加料的部分，很多，量大管饱，但是质量不高，这个加料还特别喜欢脚，用词也是什么雌臭之类，有点突兀了属实，不过还是可以尝试一看。"},{"title":"我的妈妈有双重人格","score":8.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，纯爱后宫刘备，亮点是男主一家富丽堂皇，但只有男主一个独苗，姐姐阿姨宠爱她，然后就是喜闻乐见的乱伦。然后妈妈白天是正经人格，晚上则是魅魔人格，喜欢调戏儿子。不过郁闷的是男主前期丁丁太小了，有了系统才逐步加长。此外她的推女也比较墨迹，一直到后面才推母。但喜欢都市家族的依然可以看一看。"},{"title":"我的魔法飞机杯","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载飞机杯题材的，开头就是男主意外得到飞机杯，然后用飞机杯沟通并干了母亲，结果被姐姐发现了，后来就是姐弟两人玩弄母亲，后来姐姐也跟弟弟做了，挺刺激好看的，虽是小短片但质量还可以。"},{"title":"小马仙侠ntl","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇完结极致的仙侠ntl文，男主一穿越到仙侠世界，就因为自身是纯阳之体被两对人争抢，因此本文分为两部分，第一部分是仙子，男主被仙子老公要求与仙子双修，男主也不付他望，在师父闭关期间上了师娘，然后就是各种夫目前犯，第二部分是女帝篇，男主服侍完师娘后按照约定来服侍另一波人女帝，也是在女帝老公面前夫目前犯。本文刘备量大管饱，保证你ntl看的爽。总结喜欢仙侠和ntl的必看好吧。"},{"title":"九龙巨屌诀","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，玄幻后宫，内容主要是关于男主在玄幻世界里有一根可以修炼的超级大鸡巴这件事，作者的初心是让各种各样的H在玄幻世界里面常态化、正常化，在剧情中融入H和变态，总体上，就是对无脑装逼爽文的套路进行H化改编，读起来还是有点意思的。不过实际观感就是内容太抽象，色色的少，搞笑的挺多。文笔其实一般，不过脑洞还好，不过看下来也只有抽象的脑洞了，其他方面真不怎么行。总结喜欢搞笑和脑洞的推荐观看。"},{"title":"我的大学生活","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇都市纯爱后宫刘备，作者是知名推土机文写手七分醉，该作者特点是作品很多，而且作品量还很大，至于为什么能写这么多，在于比较水。他的书基本上流水账似的推土机文，适合不带脑子看，男主推女也是几章一个，男主自身堪比人形魅魔，不过作者很多爽文特点，所以观感还不错，无雷无绿。本文也是如此，不过男主不止跟学校里面的美女搞，男主放假回家还会跟母亲和妹妹做，比较刺激，不过后期有些情节逻辑不足，但总体喜欢推土机爽文的还是可以一看的。"},{"title":"反派：我的母姐是大帝","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，玄幻后宫，内容其实跟著名的《反派，我的母亲是大帝》差不多，都是高贵的男主下万界打脸收女的内容，不过这本母亲比较弱势，强势的是姐姐。至于推女就是推土机。文笔一般，感觉还不如那一本，只能说邯郸学步吧，不过也是无雷无绿的爽文，最后总结喜欢这一题材的可以看看。"},{"title":"寄宿在妈妈闺蜜家，拿下柳阿姨和他的两个女儿","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载,都市纯爱后宫，内容如标题所言，不过基本不是男主攻略的，是她们主动的，也可以算是年上文，到后面基本是三女一男，看着感觉还行，肉戏的部分还不错。之后估计会收母亲。整体就是一质量中上的无脑肉文，总结喜欢年上和多p的可以一冲。"},{"title":"和嫂子同居的日子","score":8.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"经典的都市后宫文，老书了，在尺度上确实很大，天天开车，描写的也还行。剧情上是都市那一套，开局很快就收了嫂子，之后一路平推，女角色刻画的还行，不过因为是老书，所以情节有点老，也有漏女的雷点。总之喜欢都市的可以看一看。"},{"title":"欲神战记","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载纯爱后宫，描写的很好，女主圣女傲娇式地服侍男主，那种圣女自甘duo落地感觉非常不错。虽然更的比较少，但是还是很值得期待的，好评。"},{"title":"转生修仙界后攻略美艳熟女","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，仙侠后宫，比较诙谐俏皮的作品，里面玩梗较多，作者是p站的，也说过这不是一本正经的刘备，喜欢在里面玩梗，当然写女主的时候会认真写。剧情方面男主带着系统穿越然后在修仙界冒险的故事，推女方面目前还是推土机，稍微带点情感。整体是一部带有点新意的中等作。总结喜欢修仙的没事可以看看。"},{"title":"性爱抽卡系统","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，都市后宫，这本也算经典了，前期还是很好看的，主要是剧情节奏不错，加上文笔和肉戏还行，看的下去。这个抽卡系统不仅可以增强自己，也可以变化自己的女友，男主本来的女友就是个普通偏上的，在男主的配养下才变成大美女，这个也是男主推女的重要手段。此外系统还可以开副本，进入各种位面开新的题材。可惜的是高开低走，前面的副本都还写得很好，从副本出来就不行了，作者应该是没定好书的大纲和基本框架，刚开始想写无限流穿插现实，但是写完第一个副本就没灵感了，又开始写现实的。总之建议看完第一个鬼父的副本就可以不用再看下去了。"},{"title":"人前你后宫，人后我性奴","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇后宫，巨乳萝莉，道具tj，主奴，emm，不算纯爱，就是男主tj朋友的后宫为性奴，没有感情，分数不高，但描写的很色，人物也可以，无绿且好冲。"},{"title":"三千劫后，继承绝色仙子们的调教契约","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，仙侠后宫调教，故事很新奇 ，是男主在攻略仙子游戏中当攻略仙子的大反派，而仙子们们也没有彻底堕落，而是耗费无数时间，终于阴死了游戏里的男主，结果现实里的男主穿越进了游戏，因此仙子们知道还没有胜利，于是继续寻找男主的故事。故事整体偏向黑暗调教，涉及人体，有点重口，并不纯爱，只是后宫，不过男主对她们也毫无感情。看点主要是作者的情节把控，以及对女主们的各种刺激调教。总结喜欢暗黑调教仙子的可以一看。"},{"title":"三国淫堕传","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"emm，一开始我还以为是那种群p恶堕文，但是看了之后发现这个是1v1的单元剧，内容都是女主成为男主的奴li，然后男主调教女主的故事，不过就是男主是只忠于调教女主的，没有后宫，女主最后也往往沦陷于男主的调教中，最后与男主过上了性福生活，优点是你能看见比较多的比较温柔的调教手段，在纯爱中比较刺激。雷点是调教过程中避免不暴露等等手段。"},{"title":"我破了妈妈的女儿身","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇纯爱都市后宫文，如题所见，常见的都市乱伦文，男主是妈妈做试管婴儿养出来的，男主前期先上了表姐，后来拼接各种机会肉到了妈妈，总结就是喜欢家族乱轮的可以一看，质量不算高，但也能看，就一代餐。"},{"title":"《新婚》","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"东风瘦著作，作者取名感觉跟西风紧有的一拼，是后宫小说，ntl题材，主要就是男主跟朋友的妻子和朋友的故事，一共两卷，不是那种纯爱类型，但是男主征服她们的过程写的很好，能让你记忆深刻。"},{"title":"末世调教性奴","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇都市纯爱后宫，推土机文，内容里基本没有末世，基本内容就是男主作为小屁孩去推各种女的，上至母和姐妹，下至同学和老师，没有什么好的剧情，从头到尾就是剧情为推角色而服务，很常见的手冲文，读她完全不需要带脑子，总结适合喜欢看无脑爽文的人看。"},{"title":"山海界","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"47万字后宫刘备小说，怎么说呢，剧情方面有点太抽象了，后期什么妖魔鬼怪都有，包括什么初音未来，洛天依，斗破苍穹等等，让人在刘备之余感觉十分抽象，不过刘备还是比较多的。感情戏不多，基本上都是无脑推。"},{"title":"魔都精兵的邪恶计划","score":8.4,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"日漫同人，说实话很少看见有写几十万字的日漫同人，写得也可以，就看过，也能体会到里面角色的反差感，但还是推荐看过原著的人看，主要是里面出场的女角色比较多。"},{"title":"女大男教师","score":8.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇都市纯爱后宫文，内容是意外获得【幸福人生】系统的男主，接到了姐姐帮忙找的一份工作，但工作的地点竟然是一座女子大学。为了不让姐姐操心，男主只能前去应聘。各种巧合之下，他竟然成功入职。然后发生的猎艳故事，有纯爱也有ntl，质量中等，刘备方面有主奴调教内容，调教学生之类。不过可惜的是作者明确说停更了。"},{"title":"仙路美人图","score":8.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，仙侠后宫，小马拉大车，仙子姐妹井，这是一本仙侠老书了，我也基本看过，之所以之前不写，主要是他虽然是后宫，但不是纯爱。这本书主线是男主在女幽魂的帮助下向曾经采补死自己的仙子复仇，因此中后期推女基本都是强暴直推，让我感觉有点不适，主要也是男主一开始也是个比较正面的小孩，前期也有喜欢的女孩，不过中后期不再隐忍报仇的愿望了。至于文笔和刘备方面倒还不错。总结喜欢仙侠和小马拉大车的可以一看。"},{"title":"仙古风云志","score":8.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，纯爱后宫，不错，仙侠类的按作者的杂谈来看，估计是个长篇，就目前描写来看还是不错的，人物的文笔，情节还是能撑起长篇的，值得期待。mlgb，这个剧情nm也太艹蛋了，卫大侠一家最后也太惨了，死了不说还摊上妖魔伪造的臭名，主角也一直被误会，看下去十分的憋屈，艹。"},{"title":"巫女屠龙记","score":8.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"当代、都市、玄幻、逆推、无雷无郁闷。通篇逆推，纯爱后宫，中篇，描写的挺好，但是就是逆推的比重太大了。"},{"title":"剑仙飘渺录","score":8.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠后宫，主奴调教。这本我在前两次更新的时候已经看过了，但是都没有写，主要是我不怎么喜欢这本书里男主对待师父和师姐等等亲人的态度，这本内容看起来是有点模仿《御仙》的，都是调教自己身边的人为奴，但《御仙》的奴更像是情调类的，男主不愿意侮辱伤害亲近之人，手段温和，能让人感受到他对师父师姐的爱，而这本男主性格和调教手段太拉跨了，虽然也是男女双方不情愿但必须的调教，但男主还是十分严格地执行主奴调教，哪怕是女主们受不住，他也不会停止，而是继续，没有多少关怀手段，让我感受不到纯爱，更像是真正要把她们调教成性奴，而非当成自己的伴侣，所以我看了一部分就不看了。此外书友反馈可能有擦边绿？搞个女配给别人当仙奴，然后后面又一个女配许诺送人。最后总结喜欢仙侠调教的可以一看。"},{"title":"带着医母闯末世","score":8.2,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇末世后宫刘备，就是末世病毒突然发生然后男主也意外融入了金蜈蚣的异能，接着在末世战斗的普通故事，前期主要是在公寓跟少妇往来，然后突破丧尸区与母亲汇合，中期借母亲患毒强制推到了母亲，情节一般，不过也存在玩梗，比如真有马保国大师。刘备方面描写的不错，是那种暴力狂肉的风格，因为大部分女的也是肉服的，感情成分比较少。不过还有一点就是本文的战斗内容也比较多，不是全。"},{"title":"修仙之后宫越大我越强","score":8.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，仙侠后宫，内容是全收超级大后宫，无雷无绿，可能有些小重口，男女比例1：9的世界而且只有主角一个男性有性能力，有血亲，超多女儿到处播种，同时还会与自己的女儿和母亲做，到了后期，遍地都是他的女儿，他的女儿刚出生就要学习怎么做一名合格的性奴给他玩，只能说喜欢父女的有福了，同时后宫的女人会百合！在玩法方面，除了常规的玩法以外，还可能会写一些调教，肛交，强奸，体液（美女的淫水尿液，尿液算是微重口。），NTL（绿别人）啥的，不会有R18G（微重口的章节我会标注）。至于文笔和剧情，基本没有，一张也就一两千字，肉玩法很多，但是详细描写很少，一本就说个玩法一笔带过了。最后总结就是天马行空的刘备，喜欢猎奇重口的后宫，可以看一眼。"},{"title":"人情偿还系统","score":8.1,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇都市后宫刘备，是作者的有一力作，内容是男主有人情偿还系统，只要让别人欠自己人情就能获得积分然后用积分来催眠对应人，但不会改变性格。比如在前期男主就这样干到了欺负他的同学的妈妈，让她一边讨厌男主一边又想给男主生孩子，这本注重调教和反差感，越到后面女的身份越大，但你要说男主跟女主们有什么真感情，这个很难说，毕竟都是催眠来的。总结喜欢都市反差调教的可以一看。"},{"title":"我在书记家被三女喂养","score":8.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载都市后宫文，怎么说呢，设定和写法都是古早都市文，如果没有刘备，那我估计不会看，有点审美疲劳了，不过他还是有刘备的，没事的时候可以看看，套路虽然旧，但还是比较爽的。"},{"title":"催眠神瞳","score":8.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇连载，都市后宫，作者是《淫仙路》的作者，但是这本远远比不上那本，本作内容跟标题差不多，催眠向的纯肉文，文笔比较小白，推女也跟推土机差不多，母子，兄妹都有，感觉就是作者的试水作，不难看，但也不值得专门看。总结喜欢都市催眠 以及作者的，可以看一眼。"},{"title":"魔物娘大陆求生记","score":8.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"后宫，逆推。这本我看了之后冲爆了，干净了，大彻大悟了。但是没有多少剧情和人物，就一纯粹刘备。可能存在的郁闷点：主角遇到的每一个魔舞娘都以被z干至丝为结局，逆推味比较重，而且是人外比较看xp。"},{"title":"阴阳炼器法","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇仙侠后宫，最大亮点是独特的炼器法，把女的练成各种器具，比如男主开头穿越很惨，全靠炼器法开局练了一个酒仙子为酒葫芦，后面就是不断征服女人，练为各种器具，这些器具都有通感，摸器具就等于摸人身，还有等等玩法。他的剧情也不错，男主前中期还去了各种镜花缘式的国家游览，如君子国等等，看得出来作者是有创意的。缺点是男主长的又矮又丑，征服女的也基本是强的，基本没有情，只有色。总结想了解玩法和剧情的可以一看，其他不怎么推荐。"},{"title":"天纵大家主——男人家庭梦","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇完结，都市后宫。改编自一本老书《男人家庭梦》，背景有些混乱，但总体设定在偏现代(1960-2000都有)，主要是以肉戏为主。将自己看的绿文、乱交文，通通改成单男主向NTL，同时加强了点逻辑，作者闲来无事弄来玩玩。本书无绿，只有主角绿别人，大后宫，想给一片李文当家的环境下，多上一点让人感到温暖的大主角纯爱文。前面可能糅合改编得很差，后面就慢慢好起来了。"},{"title":"上古之神的征服之旅","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中长篇连载，异世后宫，穿越的男主有了神之力，然后就是用着神之力催眠，常识修改之类的方法不断推土，肉戏比重很大，就一纯粹的肉文，基本没有感情戏。总结喜欢这种常识修改的肉文的可以看看。"},{"title":"末日调教包括女儿","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"末世调教后宫刘备，这个就重调教了，男主在得知末世降临后又有系统很干脆啊，迅速做出了决断，不断争抢地盘，在这个过程中，男的全杀，女的也只留漂亮的，毕竟在末世吗，人又不值钱。女的反抗的就有忠于男主的女的进行调教，哪怕出了人命也无所谓，男主最关心的只有他的姐姐，其他的都是rbq，地位几乎没有，后面也是上了女儿之类的，建立起只有自己一个男的所有女的都服侍他的势力。总结喜欢纯爱的可以不看了，喜欢后宫和调教的可以一看。"},{"title":"地球ol","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇都市后宫刘备，这是作者第三本刘备，这本依然延续了那种低贱干高傲的写法，但是本作观感实在不行，本作核心是地球ol游戏，在这个游戏里每个参加游戏的男人会凭借自身手上的女性卡牌互相竞争，输的一方会输掉自己手上的牌，在现实中则会让对方占有。不过每次有30天冷静期，30天还没赢就彻底失去了。观感不行根源在于男主是个高中生，跟个废物一样，每次输就当缩头乌龟，在干别人女的时候嚣张，一旦被打败就丧失了斗志，关键是他TM老输，看的实在是窝囊，所以他虽然刘备依然写得好，但是不怎么推荐。"},{"title":"我在精灵世界出卖美色","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"又名总是被魔物娘逆推","is_classic":false,"is_jialiao":false,"review":"逆推后宫纯爱文，还带点ntl。不要被书名误导，魔物娘精灵一个不见，涩到能把人心挖出来的大欧派御姐比比皆是。作者对女角色的刻画也是功力深厚了，文笔剧情都不错。还有喜闻乐见的逆推倒贴。可能郁闷点：设定上男主有点弱受伪娘化了（虽然主角切开是黑的），扮猪吃老虎多一点。"},{"title":"独尊品相录","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇后宫，不过文风太古早了，就是无脑推，男主是复仇者，一路上征服许多女的，说实话，质量文风都一般，但是量大管饱，喜欢以前刘备风，以及推土征服的可以看看。"},{"title":"凡人修仙传同人第二魔界","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇后宫，纯刘备，量大管饱魔改剧情的巨量刘备同人，没有多少情，全是刘备，包含ntl，不过无绿就好。"},{"title":"风花雪月楼","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"纯爱后宫，主要是推了姑姑和仙子般的青梅，对仙子青梅的刘备的描写还可以。但是可惜并气愤的是第一卷结束时，阴谋揭晓，男主像条狗一样被打倒在地，md太憋屈了，看来是一个复仇文，等复仇之后再考虑上八分还有前期男主还收了个人妻，不过开篇就是人妻被人run，有点劝退。"},{"title":"风流女儿国","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇纯爱后宫，要素众多能看，是传统推土机文，情节无脑，男主就像魅魔体质，肉的描写不是很详细，总结是量大管饱的粮草，篇幅突出。"},{"title":"穿越从变成一颗跳蛋开始","score":7.9,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇纯爱后宫，姐妹，白虎没有剧情，新奇点就是跳蛋，刘备描写的也不错，无绿不错"},{"title":"我绑定了标签系统","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，都市系统后宫，剧情是男主意外觉醒了【标签系统】，然后他给妈妈、妹妹、小青梅，隔壁班的好朋友打上标签，她们都变成了痴女。肉含量比较高，部分使用ai，文笔不是很好，剧情一般，女角色形象不是很好。总结质量一般的纯肉文，喜欢打飞机的可以一看。"},{"title":"天命剑仙之性爱修仙系统","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"中篇连载，仙侠系统后宫，加上了系统就比较无脑了，没什么剧情，女角色也基本是推土机推的。这些只能说一般，同时后面的章节还有个大雷，整了个有自我意识和记忆的分身和自己后宫搞4p，我只能说什么鬼，说实话这种分身没有自我意识已经够难蚌了，有了自我意识那还叫什么，所以有读者怀疑完全是作者的xp藏不住了，但因为某些原因不想写明晃晃的ntr所以搞这种掩耳盗铃的东西。除此之外到没什么了。总结不在意这些雷点的可以看一眼。"},{"title":"一瓶听话水，阿姨和学姐当面对舔穴","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"完结短篇，都市催眠后宫文，纯粹的催眠肉文，主奴调教，女奴争宠，要素齐全，主要就是看反差感，刘备上是p站母猪类型的刘备。总结喜欢这种催眠调教的可以一看。"},{"title":"云和学院归来的学姐","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"后宫，纹身，兄妹，姐弟没有剧情，感情，纯粹的刘备，不过xp比较奇葩，喜欢纹身，妹妹纹身，姐姐穿环，头一次见到子宫颈穿环的，nb。其他几个女主基本都穿了乳环。得益于大尺度的tj，因此刘备比较好冲。但是怎么说呢，纹身和环含量太大，对于不是xp的可能难以接受，比如rt和阴唇纯黑，甚至yin道还能给你染黑。"},{"title":"我有一座恐怖屋（加料版）","score":7.8,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":true,"review":"一开始我看到书名就没有读的想法，因为看起来跟纯爱后宫无关，没想到后来还看到了加料版，里面翻了一下，佩服加料者，太强了，每隔几章就有加料。不过很多加料很强硬。喜欢加料的和这本小说的可看但是喜欢纯爱后宫的就不推荐看了。"},{"title":"寄宿在少女之家的日子","score":7.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇无脑后宫文，一男三女，没有剧情，有点意yin，不过作为纯粹的手冲文，还是不错的，也没有雷点。"},{"title":"双界行","score":7.7,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载，玄幻后宫，男主开局就有神之力，一路基本毫无阻碍，推女跟推土机一样快，剧情就是穿越世界，然后在这个过程搞搞女的，文笔剧情都很一般，虽然里面大乱炖了很多东西，但一眼看到头。总结打发时间的可以看一眼。"},{"title":"无限之禽兽修仙者","score":7.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇连载,都市，仙侠后宫。这本书内容一眼望到头，我就看了一点就放弃了，之所以放进来，是书友的评论实在难蚌，首先是调侃5-60的老太婆都下得去屌，真几把恶心感觉。其次反馈换人写了，前面还是武侠修仙，后面感觉变成都市了。这个主要是文笔太差了。最后反馈没有女明星，女帝之类的高贵的被攻略。总结想看的就看一下前面的，避雷一点。"},{"title":"幼妻阮花","score":7.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"短篇后宫，萝莉，初处，白虎，母女，姐妹女主是男主在越南买下的处，男主还是比较温柔的，后来收了母女三人，雷点有的，比如女主母亲是鸡等等"},{"title":"租赁系统","score":7.6,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇，后宫，神豪类系统，推土机没有多少剧情和感情，就是纯粹的推土机，亮点是各种女神人物给男主下单，不过过程可能有点尬，被男主征服。"},{"title":"调教同学家人的肉体","score":7.5,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"调教后宫文，但不推荐纯爱观看。男主开始被同学霸凌，后来就复仇将同学的家人即他的母亲，女友以及女儿（这个好像是男主跟他女友生的）调教的故事，怎么说呢，第一部还好就正常调教，再加上ntl，把同学洗脑成绿帽奴了，但后面的第二部最后就有点重口味了，男主还给女奴们吃毒品，调教成彻底的rbq，不怎么对我胃口。而同学还见证了这一切，最后同学不仅崩溃了，还被切了。当然这个也许是同学咎由自取吧。"},{"title":"世界调制模式","score":7.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"长篇，系统类催眠，常识修改，np，不一定纯爱，花样繁多。长且杂乱，不怎么好看，里面可能涉及了多p，只能是次一档的无脑手冲文"},{"title":"剑破天穹","score":7.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"不推荐的一本这一本也是纯爱后宫，但之所以不推荐就是剧情不行，虽然是废柴逆袭但是作者写的比较憋屈，往往主角一个升级没过多久就被耻辱打败，这种情节出现了三四次，而且前期男主父亲也是个出生，各种sb操作让人血压高。真的看到后期支持我的只有他的刘备了。 连载中"},{"title":"成为魔王，从飞机杯开始","score":7.3,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":false,"is_jialiao":false,"review":"太监后宫刘备，怎么说呢，这本本来是反对另一部无脑的飞机杯绿文，立意很好，但是作者的文笔很显然不能支持这一想法，到后期自己创作的时候无聊，越来越无聊，可能你也就是想怼一下那个飞机杯的小说吧，这个没啥说的那个小说确实傻逼，但是你这后面剧情真的太无聊了，而且人设一个比一个难绷，前后互搏又强行找补太难看了"},{"title":"《冰封魔恋》","score":7.0,"score_system":"10","category":"纯爱后宫盘点","meta":"","is_classic":true,"is_jialiao":false,"review":"来本特别的《冰封魔恋》这本也是跟《妖刀》一样的经典，也是我在读经典中踩的坑，不过他比妖刀更极端吧，一点纯爱没有，相反是调教警察文鼻祖了差不多。可惜当初的我不知道，一头扎在里面，看到一个个女角色接收男主的奴隶式教育，看到女主不断反抗但又不断失败最终堕落，当时我就没看下去只是草草地看了下结尾，记得好像是男主成功了。此外本书的另一特色是巨乳，男主特爱巨乳，他捕获的基本也是巨乳。最后这本经典时代的作品也是启发了后面很多个作品，但在质量上他仍在前列。\n\n首先这里的3分相当于7到8分（平庸，不读也行，凑数的），4分相当于8分多（可以一读，试试胃口），五分相当于接近9分（推荐阅读，是精品），6分相当于9分多（那属于是必须尝试的）其次这里我分成了四个部分，首先是韩轻神作，这里4分及以上每一个都推荐阅读，其次是肉文，里面纯爱，后宫，ntl，调教等等都有，然后是擦边文，大部分来自于次元姬或者少年梦，大部分都有加料，虽然加料很多就是ai就是了，不过也有手加的，比如苏幕遮，地爆天星，大鹅，north等等，他们都是大佬。最后就是新开的综漫文，特点就是里面很多女角色都是动漫里的，比如常客雪之下雪乃，英梨梨，霞之丘诗羽等等知名老模女角色，还有难蚌的是大部分还会带上他们的母亲，来上母女盖饭什么的。"},{"title":"不良少女们霸占了我的家","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"神，最好看的一部，目前一共征服了四个女主，四姐妹，都是纯爱，最好看的就是前期这些不良少女一个个都嘴上不在意男主，可实地里早就爱上了男主，跟男主做爱 随便被男主一插就哦吼吼了，尤其是有的女主还厌男，但是遇到男主就讨厌不起来，这种反差感直接社保了。此外，后面可能还会征服2个，一个人妻，一个清纯学妹，简直爽爆了。"},{"title":"飞机杯无线连接","score":6.0,"score_system":"5","category":"韩轻神作","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"200w字大长篇，novelpia韩轻网站上纯血皇叔天花板，没有剧情只有情趣，玩法多样但没有绿，全篇只存在唯一一个fc但那是作为男主ntl的对象，这本书可以说是韩轻里面热度前几的经典皇叔了，不过可惜没有插图，但是他有同名漫画，漫画的质量十分高，也是热门韩漫，两者配合相得益彰了。"},{"title":"精灵姐姐变得♥非常非常非常♥坦率了！","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"难得的一对一的姐弟情侣文，这就是绝对的纯爱啊，不过之所以是单呢，是因为女主是我看过最病娇的姐姐，男主要真搞外遇，分分钟死在外面，当然女主也不是天生就是病娇，主要是家里遗传的魔器让姐姐的身体无比坦诚，子宫里一直都得有精液，这才能避免姐姐发疯，最后姐姐也是成功怀了身为弟弟的男主的孩子，摆脱了诅咒，圆满大结局，而且本作的插图数量众多，质量也很不错，综合下来，必须给满分。"},{"title":"利用怀孕技巧与霸凌者发生性关系","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"三女主，两个偶像，一个有男朋友的前辈，大致就是男主会通过系统给的假怀孕，获得一个时效一天的技能，然后把女主操服的故事，女主沉沦描写的不错，加上质量十分高的插画，给满分（没插图滋味少一半），后面还有新出现女主两个待攻略，也很好看。"},{"title":"享用祖母们","score":6.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"男主开局被身为家主的人渣哥哥卖给了300多岁的魔女当老公，在上路前男主意外得知了家族第一代家主就是靠一手特攻长生种的性爱魔法征服了长生种，然后从她们手中得知了许多强力魔法创立了家族，男主学习了魔法，然后到达地点发现三百多岁的魔女原来是他见过最美丽的女人，然后狠狠草服了魔女，精灵，龙娘，哥哥嫂子等等，而且图也特别好看，还是无码的，直接冲爆了。"},{"title":"吃朋友妈妈和妈妈朋友的方法","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"（ntl）好多女主，包含朋友妈妈等等，调教拉满，同样是超绝的插图，母女盖饭，夫目前犯，剧情简单，描写细致，冲得很爽。"},{"title":"偷看女老师的手机","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"（ntl）也是三女主，这回是系统能直接偷看手机，然后直接威胁，狠狠草服这些女老师，还有就是插图，属于那种质量最好最色的类型，数量也多，主要是插图顶啊。"},{"title":"成为S级猎人们的向导","score":6.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"插图很不错，跟上面一样顶级，三个女主的人设也还可以，至于剧情经典猎人向导，韩漫也老出现，可以说是韩式特色了。主要是插图的质量很顶，数量也很多，还得是插图。"},{"title":"在贞操逆转世界生存","score":6.0,"score_system":"5","category":"韩轻神作","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"男性在这个世界是极其稀少的贵族，男主突然出现这个世界，引起了全世界的震动，因为他是凭空出现的，人们怀疑是贵族女性故意囚禁高贵的男性取乐，引发了骚乱，然后就是男主征服的故事，插图质量很高，数量也不少，可以。"},{"title":"S级疯女人与囚犯部队管理","score":6.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"男主是管理s级罪犯的异人，开局管理两个疯女人，不过得等到全书四分之一，一百多章的时候才上本垒，那个时候才有插图，插图质量一般，数量勉强还行，像是初阶ai生成的。"},{"title":"攻略女猎人能变强","score":6.0,"score_system":"5","category":"韩轻神作","meta":"超长篇完结","is_classic":false,"is_jialiao":false,"review":"最经典的猎人题材，这个作品已经有了韩漫，名字叫越操越强-双修猎魔记，不得不说写得确实还行，后期也是狠狠调教上了，图片后期质量也有所进步，前期可以看看漫画的画风，后期看插图即可。"},{"title":"成为异常性欲长生种们常驻的论坛版主","score":5.5,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"男主受异世界女主神的召唤，当她们世界的论坛版主，处理长生种的异常性欲，代价是女主神的身体，女主神喜欢男主，也成功让男主留了下来，随后征服了精灵之类的，配的图也特别多，质量也不错，不过这本之所以没上那个6分，是开头引入太乱，以及论坛这个题材我本身不感兴趣，但是色色写得不错。"},{"title":"独占成人游戏中的女主角","score":5.5,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主穿越成黄油中，不过是被牛的那个，因为原身体的他会接受村民的提议，会娶一个后面抛弃原男主的浪荡女，不过这个女人的妹妹和母亲都很好，因此男主设计告破了女人与村长儿子的奸情，好决定与妹妹结婚。经过冒险后也与妹妹相爱，这一段很纯爱，同时也征服了岳母和村里的修女，插图配得也很不错，整体不错。"},{"title":"我成为了女猎人痴迷的经纪人","score":5.5,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"开局男主卷入事件，意外成为世界上唯一一个男性觉醒猎人，能够给s级女猎人极大的辅助能力，成为她们痴迷的经纪人，整体插图高质量，数量也很多，综合也是很不错的，就是小说写的高层博弈有点难蚌，扣一点分。"},{"title":"成为自制RPG变态正太主角","score":5.5,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"穿越到黄油成了原著牛别人的牛头人，然后开始了征服苦主母亲什么的牛头人伟业，ntl，盖饭拉满，图也很多，不过之所以没给6分是因为图的画风不是很符合我胃口，虽然也很不错就是了。"},{"title":"在游戏中与雌性角色交合","score":5.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"这本有点重口，什么乳腺交都来了，不过玩的确实最花，图也确实好看，数量也很多，属于是不带脑子光冲的类型，纯爱什么的感觉没有。"},{"title":"转移到了奶子奇幻世界","score":5.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主因为意外误入转生世界，女神为弥补错误，给其随机抽取能力的机会，最后抽到了绝对魅力，只要亲密接触就能调整好感度，男主随后就拉满女神对他的好感度到100，草上了女神，然后就转生到奶子为重天下，无脑看开后宫，图还是不错的，又多质量还不错。"},{"title":"我训练了黑手党老大","score":5.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"剧情比较无脑，女主很多，调教也多，也更色，就是中后期有点重复，不过因为插图很多，质量也很顶，所以看着还行。"},{"title":"异世界论坛管理员","score":5.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"三四个女主，也是论坛型，纯爱和调教的女主都有，玩法也挺多的，插图画风偏幼，全篇也基本是少女类型，质量和数量都很不错。"},{"title":"转生为游戏配角，却被熟女们执着","score":5.0,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"男主转生到西式魔法世界成为配角，男主本身也是坚定的熟女控，坚定地攻略熟女。色色还行，就是插图画风一般，虽然数量可以，不过质量对比其他差点。"},{"title":"财阀家小女儿的家庭老师","score":5.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"三小女主的短篇纯爱故事，总体是纯爱后宫的师生流，没有什么催眠强暴，还是女主主动的，我喜欢。"},{"title":"乱入百合后宫","score":5.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主与几个学姐之间的草逼故事，比较无脑爽，图也不错，就是有点短。"},{"title":"在加载色情MOD的黑暗TRPG中成为领主","score":5.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"游戏讲的多一点，比前几部有一定阅读难度，图画风跟前部也不一样，不过整体角色和剧情还是不错的。"},{"title":"我在黄油里当特性收藏家","score":5.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主开局靠磨炼的砍柴和治疗特性，拯救了女主姐妹两人，纯爱后宫向发展，整体文笔可以，不过要到10万多字出头才有色图，不过图的质量很高，整体还是推荐的。"},{"title":"用外卖APP点女人吃","score":5.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"能够用专属外卖软件点女人，不过有等级和时间限制，男主开局也是狠狠羞辱了之前发生纠纷的高冷冰山同事，色图数量多，质量也高，很好冲"},{"title":"精灵商会会长大人不穿内裤接受检查！","score":5.0,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"意思就是精灵会长过异世界与地球的中转海关的时候，不穿内裤，里面塞了价值连城的魔石，以便偷运过去，来缓解商团的危机，然后被男主发现，然后男主以魔石为要挟，操了女主，女主被操之后也逐渐沉沦，之后还有五个女主，女主之间的修罗场也很激烈，此外插图质量很不错，数量也可以。"},{"title":"特色新世界","score":4.0,"score_system":"5","category":"韩轻神作","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"设定挺有意思的，男主基本走到哪里，哪有就有奇怪的设定，比如男主在公司，那公司女性就不穿裤子甚至内裤，这是公司内的常理，当然男主出了公司，公司就恢复正常了，还有什么女仆咖啡馆之类的，本作有同名漫画，画的确实不错，原著还有一本同名漫画，画得也确实不错，推荐观看。"},{"title":"英雄终败于恶势力之手","score":4.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"男主是恶人，女主们是英雄，这是个男主调教英雄女主们，让他们恶堕的故事。不过因为基本是强制调教，外加插画画风比较简单，没有前面的精致，分低一点 不过好在插图数量很多，玩法也很多。"},{"title":"成了筑塔的梦魇","score":4.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"韩轻经典爬塔流，不过这次是男主创塔，选择了魅魔之塔，内容就是玩家征服自己的欲望，能通过色欲的考验，图不多，但质量还可以，雷点就是里面角色的失败录像都会放出来，女主基本都被所有人看光了。"},{"title":"征服傲慢女人的方法","score":4.0,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"后宫，偶像，调教，姐妹丼，全处全收，扭曲，整体插图少一点，不过质量还是可以的，文笔比较奇怪，得熬一下前期。"},{"title":"成为了异常性欲女猎手们的烦恼咨询师","score":4.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主是心理咨询师，几个女主的心理问题都挺有趣的，比如第一个女主是想要个爸爸，后面还亲自穿了婴儿装，整体还行就是，图有点少，质量还可以，尤其是做爱的图太少了。"},{"title":"驯服学院女恶霸","score":4.0,"score_system":"5","category":"韩轻神作","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"女恶霸还是正常的，不过最后把勇者变性成女的，然后上了，确实变态。属于比较难蚌。不过比较特别的就是里面女角色最后还怀孕了。"},{"title":"成为搜身的关卡守卫","score":4.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"三四个女主还是不错的，不过插图里做爱的画面比较少"},{"title":"女主角寝取","score":4.0,"score_system":"5","category":"韩轻神作","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"极致ntl之文，系统发来就是为了完成干人家女朋友的，评分低时可以主动重来，要让苦主感到极致ntl，只能说脑洞不错，文笔也还行，不过是无限流，一直连载了两三百万字，看点前面的就行了，后面就重复不少了，插图质量和数量都挺适中的。"},{"title":"成为驱魔部执着的催眠师","score":4.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"男主穿越到游戏里，变成了原著一个阴暗的家伙，然后男主逐渐成为一名催眠师，开了后宫，不过插图风格化强烈都是黑白为主，基本没有彩色，而且肉戏的也没几张，比较拉。"},{"title":"穿成言情文里的黄文作者","score":4.0,"score_system":"5","category":"韩轻神作","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"修女，千金大小姐等等，插图数量一般，质量还可以。"},{"title":"异世界人妻猎人","score":3.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"两三百万字的长篇，上了很多人妻，不过文笔比较小白，基本都是在草逼，狠狠ntl，好像有漫画，插图的话，比较少，质量也一般，主要是文字吧。"},{"title":"吃掉勇者的家人","score":3.0,"score_system":"5","category":"韩轻神作","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"就是男主是团队主力辅助，然后勇者就知道草逼，不去讨伐魔王，气得男主退队了，直接找了魅魔女神，去征服勇者的家人，最后勇者也变成女的了，被男主操了，难蚌。图的质量还可以就是有点少。"},{"title":"VVIP色情软件收服专属艺人成为娱乐大亨","score":3.0,"score_system":"5","category":"韩轻神作","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"纯草逼文，还是直播给人家看，来获得打赏挣钱，没什么情感，只有肉戏，不过肉戏也没刺激到描写，大部分都是一笔带过，不过图挺多的，质量也还行。"},{"title":"天汉风云","score":6.0,"score_system":"5","category":"刘备肉文","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"历史争霸肉文，主角是来到一个架空的，各种历史知名人物混杂的世界，男主在故事开局就已经做到了将军，救下了险被盗贼侮辱的女状元女主（这一段也是本作最大的雷点，就是女主差点被猥亵了）。男主身为将军，被刻画得也很有魅力，屡次力挽狂澜（朝代类似于北宋，皇帝就是宋君），女主在后面被吸引也逐渐爱上男主，除了女状元还有草原公主，女太医，女公主等等，每一个女角色描写得都不错，与男主之间羁绊同样深刻，肉戏也不错，还有多p，就是那种的正统的纯爱后宫。剧情方面，占比很大，争霸打仗，给我感觉就像看正经历史争霸文一样，还有就是看得名将乱斗，也是比较难蚌，比如男主手下就有秦叔宝，戚继光。本作第一个大副本是安史之乱，第二个大副本是金人南下掳走二帝，只能说会缝合的，不过观感确实不错，希望后面不要暴雷，作为历史文爱好者，还是给个好评。"},{"title":"我，清冷校花和暗恋她的女闺蜜","score":6.0,"score_system":"5","category":"刘备肉文","meta":"短篇完结肉文","is_classic":false,"is_jialiao":false,"review":"真纯爱后宫向，富二代男主遇上清冷校花，两人暧昧之时，竟得知她身边的好闺蜜是自己的情敌，就很难蚌，最后在两人的劝导下，男主接受了闺蜜，之后开启了三人行，结婚也是三个人一起，圆圆满满的结局，这是什么科幻小说吗"},{"title":"掌握催眠之力后的淫乱生活","score":6.0,"score_system":"5","category":"刘备肉文","meta":"蘑菇麵要加蛋合集","is_classic":false,"is_jialiao":false,"review":"蘑菇面是p站老作者了，更新的作品也数不胜数了，大部分都是催眠后宫类型的纯肉文，不过蘑菇写的肉都很色 很好冲，什么母女，ntl，家常便饭了，总之十分推荐。"},{"title":"藏仙","score":6.0,"score_system":"5","category":"刘备肉文","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"仙侠修仙世界，简介：我做包皮手术穿越到修仙界，被合欢宗抓去当双修实验品。邪功入体后阳物缩入腹腔，人人以为我是废人。清雪宗的仙子把我捡了回去，日日以灵力滋养，说我“根骨受损，好生可怜”。可她不知道——我藏在她身边的每一天，都在等那个秘密藏不住的时刻。很不错的展开，前期还有个合欢宗的傲娇处女偷来看男主，原本是想让他助自己修行，不过后面不知不觉间爱上了男主。中期就是男主与仙子女主的修行故事，不得不说女主确实清冷，那种虽然懵懂，但是身子在做色色事情，确实很好冲，后面还加入了女主的师尊陪女主一起，好冲。"},{"title":"新婚","score":5.5,"score_system":"5","category":"刘备肉文","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"偶然想起来这本老书，发现早已加入书单，但是评分一般，如今以ntl的视角来看还是不错的的。这也是一本老书了，好几年前的了，文笔写得还可以，女主形象也很立体，可以说是ntl文里的标杆了，每当在论坛推ntl文，新婚总在榜内，足以见他的人气。我当年还没怎么读过ntl文，第一次读到新婚，确实是很震惊，男主接连拿下好兄弟新婚老婆还有前女友的桥段确实经典，两个女主描写得也很好，从喜欢苦主到沉沦在男主身下写得很不错，当然主要是苦主很犹豫，一直在老婆和前女友间纠结，这才给了男主机会，也属于是自己的苦果。"},{"title":"ntl大师兄的日常","score":5.5,"score_system":"5","category":"刘备肉文","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"玄幻纯爱后宫精品，不错不错，男主作为大师兄冷静果决，推女也十分果断，肉戏因为女主们的反差也比较刺激，剧情和文笔也不错，精品值得观看。"},{"title":"电梯故障，涨奶巨乳人妻求我帮忙","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载肉文","is_classic":false,"is_jialiao":false,"review":"虽然是ntl，但男主不急不躁，一步一步地攻略人妻女主，最后成功让女主自愿沉沦，给男主喂奶，写得十分详细生动，给予好评，这个ntl写得我还是比较认可的。"},{"title":"清安录","score":5.5,"score_system":"5","category":"刘备肉文","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"纯爱，仙侠，母子，后宫，就这几个标签，本书就已经值得一读，而且本书的母子，写得也真不错，女主独自一人喂养男主，对其是极度溺爱，因此母子很早就乱伦了，超越绝大部分同类，真爽。"},{"title":"幻灵幽火","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"仙侠纯爱后宫，主打母子一家，母亲功法阴寒，男主正好阳盛，然后就是母子双修，顺带还有男主姐姐发现并加入，至于丈夫，在母子双修突破瓶颈时，在外被魔修致死。整体上还是不错的，有剧情，也有文笔，不过里面的女同要素也不少。"},{"title":"老婆是心理医生","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"这本也是难蚌，开头伤好出院的男主看日记发现妹妹被人干了，我还以为是绿呢，结果后面全特么是男主干的，主要是男主受伤失忆了，忘记了很多事，最重要的是男主遇到了个怨鬼情凰，附身在女主还有岳母还有妹妹身上，不断缠着男主做爱，母女三人盖饭，太色了，后面还暗示附身到亲生女儿身上，直接鬼父走起。"},{"title":"天命之子你的娘亲好润","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"不错的ntl式纯爱后宫作品，虽然标题很有纨绔的味道，但实际内容，可以说是男女主的情投意合（女主是男主实力微弱时候的意中人）除了女主，还有男主女师尊，男主捡到并养起来的女儿"},{"title":"被正道剑仙师尊赶出宗门后我投入魔教教主的怀抱","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"ntr是指男主身为门派大师兄被小人背叛，仙子师尊也不管，然后魔教教主就主动收留了男主，男主加入魔教，展开了纯爱故事，顺便用自己的魅力吸引了几个魔教师姐，角色塑造上经典的魔教并不是太坏，正道一样垃圾。前期有点憋屈，中后期是纯爱后宫，不过整体观感还是十分不错的。"},{"title":"黄毛还是我","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"很正常的纯爱附带一点点后宫，不过暂时没看懂标题的黄毛是什么意思，因为男主目前还是十分正直，一心一意只爱着女主。整体文笔也十分不错，可能用了ai，但是写得确实比无脑的刘备小白文好很多，虽然情节简单，但是能让人一直看下去。此外，剧情最新更新到男主与岳母之间的互动，这一点比较意外，男主也感到了意外，写得不错，继续看后续的"},{"title":"网调母狗是冰山美人母亲","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"写得不错的母子文，内容如标题，男主作为儿子突然发现网调母狗是母亲，然后就开始线上用主人身份向母亲发布任务，让她在现实里挑逗儿子，这样线上线下一起攻略，这个过程写得比较详细刺激。最新也成功上垒了，狠狠操了美母。但是换句话说，如果这个主人不是男主就比较难受了，所以说得看你接不接受这个设定"},{"title":"未来次元之战","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"不错母子纯爱后宫文  ，如简介所言，融合了战锤的混沌四神（主要是色孽），开头就是男主抗击色孽恶魔降临事件，然后在干死恶魔时，恶魔给予血缘诅咒，然后就母子相合救命，后期还有圣女和皇后公主，还是十分刺激的。"},{"title":"尘世途","score":5.0,"score_system":"5","category":"刘备肉文","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"剧情不错，纯爱后宫，前期有些小雷点，中期男主身份有转变，是天命主角转世，所以也是自动继承了前世搞到的老婆们，（她们不相信男主死了，一直在等男主）不过仅有几个人知道，不能揭露身份，扮猪吃老虎。整体文笔比较稚嫩，真跟推土机差不多。不过结合剧情，总体还是可以看的。"},{"title":"我开的真不是成人版深夜食堂","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"最近的一本有意思的都市后宫，题材新颖，文笔不错，挺有都市气的，女主虽然是精神小妹，但也没什么大的雷点（就是谈过一两个男朋友），后面还有好几个女主出场，每个女主都有自己的特点，写得都还行，喜欢都市的可以看看。"},{"title":"被娇憨软萌亲妹妹，以及双子萝莉小表妹迷晕做爱实在太丢人了，拥有大肉棒的我，必须将三小只狠狠教训一番才行","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"p站经典的萝莉文，无需多言，冲就完了"},{"title":"精灵育成手册","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"p站，男主意外孵出来三个萝莉精灵，然后就是色色日常了，三个不同性格的萝莉，可恶我怎么没有。玩法挺多的，里面子宫性交占比也不少，符合p站风格。"},{"title":"我的暴力同桌赌输之后，成了我的母狗","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"p站文章，文笔也挺p站的，不过之所以给5分，没办法，这种傲娇，一边表面上口头骂你，但是一边又积极承受你的调教的反差确实好冲，就是口嫌体正直，包括叫主人才能高潮什么的，冲就完了"},{"title":"沐澜铃花","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇完结肉文","is_classic":false,"is_jialiao":false,"review":"双母文，一个是生母，一个是处女继母，首先是继母，逐渐与男主形成恋爱与母亲关系，然后生母又回头找男主，与继母发生一些纠纷，想通后一起服侍男主，总体还是十分可以的。"},{"title":"明月传","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载肉文","is_classic":false,"is_jialiao":false,"review":"仙子的修行，难得十分好的同人，不过本作更多只是借鉴了个人设，男主从老臭脏的老仆变成天赋异禀，修为远超人界，只是被仙界大战波及，意外跌入人界的隐士，可以说完全不是一个人了，而女主也改了名字，变成了男主与女宗主联合培养十几年的圣女，男主以老仆的形式跟在女主身边。本作前期写得很好，与女主的情感线既借鉴了原著，又以纯爱为主，中后期有点拖，专注于原创剧情，女主戏份很少，喜欢更新改进，整体还是十分好看的。"},{"title":"全球异变，全人类都只会发出哦齁齁齁齁齁齁的母猪叫！","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇完结","is_classic":false,"is_jialiao":false,"review":"很有意思的一个短篇p站文， 我只能说p站文的脑洞向来很大，这篇也是，内容如标题，本作的色色主要是事变发生初期，由此家庭乱伦等等，但这并不是故事的重点，真正有意思的是，对人们从发现到震惊恐慌，再到最后用书写与文字完全替代了口头言语的表达，已完全适应了变化，这一套流程的详细描写。故事的最后，时间线来到了未来的几十年，到那时候，偶齁齁对新生儿来说，跟一二三四已经没什么区别，因为日常就是如此，这个词的意义早被彻底更改，对他们而言，纸面表达才是正经表达，而口头则无关紧要。整体还是一个带有预言哲思的趣味肉文。"},{"title":"夫人且慢","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"最近写得不错的ntl后宫文，目前没有绿和大雷，男主攻略夫人的手段，虽然是英雄救美类的比较套路，但是观感还行，武侠背景加上不错的文笔，还是很推荐观看的。"},{"title":"我为后宫努力的高三生活","score":5.0,"score_system":"5","category":"刘备肉文","meta":"中篇连载肉文","is_classic":false,"is_jialiao":false,"review":"青春时代的肉文，基本就是男主跟女同学谈恋爱开后宫的肉文故事，不过写得比较有青春感，有欢喜也有矛盾。"},{"title":"生殖崇拜的大学生活","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"p站作者所写，设定新奇，男主在新生育法的要求下，必须在大学让几个女生怀孕。女主基本都是校花级别，然后被男主征服，肉很多，p站风味，整体写得很不错。"},{"title":"穿越修仙世界成为底层人，但我有概念级夺舍能力","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"写得不错，ntl拉满，男主有智谋有规划，前期作为底层人潜伏增强实力，后面直接夺舍宗主夫人的嚣张跋扈儿子，把他禁锢在神识里，让他看着自己站起来蹬他的女仆，后面一步步攻略他的母亲，别说看起来真爽。"},{"title":"我的冰山校花女友","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载肉文","is_classic":false,"is_jialiao":false,"review":"纯爱一对一向的，男女主都挺不错的，一开始我看标题还可以牛头人呢，实际是纯爱，这算不算也是牛，不过是牛了牛头人。此外整体还有调教，肉戏还不错。"},{"title":"我的高冷冰山青梅竹马对我至死不渝","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇完结肉文","is_classic":false,"is_jialiao":false,"review":"真纯爱一对一的，比较难蚌的反套路作品，一开始我看第三章标题是“黄毛拿照片胁迫，于是女主角就范……了吗？”，我还以为是绿呢，结果没想到是反套路，男主直接揍了那个黄毛一顿，男女主直接报警了，经过与黄毛反扑的斗争之后，成功把黄毛送进监狱了，尤其是黄毛名字就叫皇昴倚之类的，属实难蚌。"},{"title":"夏天的花，我同学的母亲","score":5.0,"score_system":"5","category":"刘备肉文","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review":"都市现实类的，内容更偏向写实一点，毕竟女主在文中的称谓都叫郭阿姨，是男主大学新生开学时一见钟情的人，之后也是一门心思在女主身上，经过了不久的恋爱与谈心，女主也是接受了男主，也算纯爱吧，就是感觉有点怪。"},{"title":"男欢女爱","score":5.0,"score_system":"5","category":"刘备肉文","meta":"长篇完结","is_classic":false,"is_jialiao":false,"review":"乡村肉文的经典代表，作者久石，笔下基本都是乡村故事，男欢女爱一共系列3部，第一部是是最正统的，大部分人读的也基本都是第一部，这一部也是最为经典的一部，可惜没有正经的结尾。第二部大概是主角做村长起步，内容的角色基本都是第一部的，第三部是主角去做大小姐的保镖的，这三部其实严格来讲都没有结尾，比较难蚌，不过还是有好心书友，给这个系列又写了一部 ，这就是佛缘第三部，紧接着原著第三部，质量还可以，不过文笔比不上原著。至于本体质量呢，我可以说是乡村题材永远的经典，男主陈楚从一个只知道打的混混到一个越来越知事理明正义的好混子，当然不改变混，是因为这是乡野出来的那种自然的傲气，是他的本质。具体来说，本作前期他还只是在小乡村里，没事偷偷谁的媳妇，到中期开始接触到城市的黑帮混战，在斗争中逐渐成长，还遇到了北大毕业到村里当村官的天之娇女，在使劲力气，终于征服女主后，没过几个月，女主怀孕，男主开始真正为了家庭思考。不过纯爱党还是要避雷的，毕竟男主最爱是红颜，在于第一女主相识相爱的过程，跟别的女人做也是吃饭喝水，家常便饭。到后面还会出现第二，第三女主。毕竟是后宫作品，单挂一棵树不可能。"},{"title":"侠女悲尘","score":5.0,"score_system":"5","category":"刘备肉文","meta":"长篇连载","is_classic":false,"is_jialiao":false,"review":"很不错的纯爱作品，不是绿文，也不是什么仙子下地狱之类的，就是一个三四十的中年女侠跟一个二三十的农家汉的纯爱故事，男主虽然什么本事没有，但是能为女主付出一切，为了女主差点死了三四次，只能说他能得到女主，我是认可的。女主一开始有个心上人师兄，可惜后面师兄害他，男主又舍身就她，渐渐爱上了男主。总体给我的感觉就不像是刘备，前几十章一点肉没有，等男女主开始交心，才开始有肉，可以当正经文看。不过本作应也有缺点，就是男主为了过日子取得农村媳妇，他们两个并不相爱，但是刚好女主是杀害女二父亲的凶手，然后女主为了表达歉意，甘愿做妾，给女二这个正妻行礼什么的，到100多章后，男女主安定下来，女二也开始折辱女主，md，我也是越看越恶心，能不能把这sb女的删了，艹。真的更新的，我反而不想看了。"},{"title":"截胡完美校草的红颜们","score":4.5,"score_system":"5","category":"刘备肉文","meta":"中篇完结","is_classic":false,"is_jialiao":false,"review":"ntl文，本作好几个女主，塑造的都很不错，可以说全是女主们撑着这本书，尤其是书中的姐妹花，获得我们群友一致好评，男主的话就算了，我个人也比较讨厌前期男主的行为，所以只能给到4.5，不过熬过前期还是不错的。"},{"title":"重生后的家庭剧本不正常","score":4.5,"score_system":"5","category":"刘备肉文","meta":"中篇连载肉文","is_classic":false,"is_jialiao":false,"review":"文笔不错，前期是兄妹恩爱，后面逐渐加入姐姐和母亲，肉也不少，可爱的妹妹肉起来确实不错。"},{"title":"我的神器居然是当年合欢宗宗主的身体","score":4.5,"score_system":"5","category":"刘备肉文","meta":"中篇连载","is_classic":false,"is_jialiao":false,"review":"由难蚌的一个创意延展开的刘备，就是男主先是捡到女主的阴部，一个类似于飞机杯的身体部位，然后唤醒了女主，在女主的劝说下，开始跟着女主学习，然后开始冒险，目的是凑齐女主的身子，拼碎片，也是比较难蚌的。"},{"title":"流落荒岛：全岛的女人都追着我要精液","score":4.5,"score_system":"5","category":"刘备肉文","meta":"短篇连载","is_classic":false,"is_jialiao":false,"review
